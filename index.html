<style>

:root{color-scheme:light;font-family:'Cairo',sans-serif;background:#faf7ef}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#faf7ef}
body{margin:0;min-width:320px;font-family:'Cairo',sans-serif;background:#faf7ef;color:#173f3e}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #12a69a55;outline-offset:2px}

.samsar{--primary:#075c59;--accent:#12a69a;--page-bg:#faf7ef;min-height:100vh;background:var(--page-bg);color:#173f3e;font-family:'Cairo',sans-serif;overflow-wrap:anywhere}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:70px;padding:10px 4%;border-bottom:1px solid #e5e6da;background:#fffffff2;backdrop-filter:blur(15px)}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;color:#fff;background:linear-gradient(145deg,var(--accent),var(--primary));font-size:29px;font-weight:900;box-shadow:0 6px 15px #075c5925}
.brand strong,.brand small{display:block}
.brand strong{font-size:21px;font-weight:900;color:var(--primary)}
.brand small{font-size:9px;color:#80968d}
.nav-links{display:flex;align-items:center;gap:22px}
.nav-links a{font-size:11px;font-weight:800;color:#45685f}
.nav-links a:hover{color:var(--accent)}
.top-actions{display:flex;align-items:center;gap:7px}
.icon-button{position:relative;display:grid;place-items:center;min-width:32px;height:34px;border:0;border-radius:8px;color:#466c61;background:transparent;font-size:19px}
.icon-button:hover{background:#eaf4eb}
.icon-button sup{position:absolute;top:-3px;left:-2px;display:grid;place-items:center;min-width:14px;height:14px;padding:0 3px;border-radius:20px;color:white;background:#d98942;font-size:8px}
.login-button,.primary-button,.search-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 17px;border:1px solid var(--primary);border-radius:9px;color:white;background:var(--primary);font-size:11px;font-weight:900;transition:.2s}
.primary-button:hover,.login-button:hover,.search-button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.small-button,.outline-light-button,.details-button,.danger-button,.outline-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:35px;padding:7px 11px;border:1px solid #cfe1d6;border-radius:8px;color:var(--primary);background:#fff;font-size:10px;font-weight:800}
.outline-button{min-height:42px;padding:10px 15px;border-color:#ffffff99;color:#fff;background:#ffffff14}
.danger-button{border-color:#f0d8d5;color:#aa4b43;background:#fff7f5}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.notification-popover{position:absolute;top:65px;left:5%;z-index:30;width:310px;max-width:90vw;padding:15px;border:1px solid #e0e8df;border-radius:12px;background:#fff;box-shadow:0 15px 35px #173d3024}
.notification-heading{display:flex;align-items:center;justify-content:space-between}
.notification-item{display:block;width:100%;padding:10px 0;border:0;border-bottom:1px solid #edf1eb;text-align:right;background:white}
.notification-item strong,.notification-item small{display:block}
.notification-item strong{color:var(--primary);font-size:11px}
.notification-item small{margin-top:4px;color:#89968c;font-size:9px}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;min-height:560px;padding:60px 7% 145px;gap:25px;overflow:hidden;background:#eee7d6}
.hero-bg{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=88');background-position:center;background-size:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(270deg,#faf7eff5 0%,#faf7efe0 42%,#faf7ef08 100%)}

.eyebrow{display:inline-block;color:var(--accent);font-size:11px;font-weight:900}

.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:23px}
.hero .primary-button{color:white}

.house-body{position:relative;display:flex;flex-direction:column;gap:13px;min-height:190px;padding:20px 16px 0;border:5px solid #d4bd97;border-bottom:0;background:linear-gradient(135deg,#fff7e7,#d4c09f)}
.house-windows{display:flex;justify-content:space-around;gap:15px}

.hero-search{position:absolute;z-index:5;right:7%;bottom:26px;left:7%;display:grid;grid-template-columns:1.3fr .8fr .8fr .8fr auto;align-items:end;gap:10px;padding:14px;border:1px solid #e5e4d8;border-radius:15px;background:#fffffff5;box-shadow:0 12px 35px #244c3b1a}

.staff-management{display:grid;gap:16px}
.staff-heading{align-items:flex-start;gap:12px}
.staff-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

<body>
<noscript><strong>هذا الموقع يحتاج إلى تفعيل JavaScript لكي يعمل بشكل صحيح.</strong></noscript>
<div id="app"></div>

<script type="text/x-template" id="samsar-tpl">
<div class="samsar" dir="rtl" :style="themeStyle">
  <!-- الشريط العلوي -->
  <header class="topbar">
    <a href="#home" class="brand">
      <span class="brand-mark">⌂</span>
      <span><strong>{{ settings.name }}</strong><small>عقارك أقرب وأسهل</small></span>
    </a>

    <nav class="nav-links">
      <a href="#home">الرئيسية</a>
      <a href="#properties">العقارات</a>
      <a href="#how-it-works">خدماتنا</a>
      <a href="#about">عن سمسار</a>
    </nav>

    <div class="top-actions">
      <button class="icon-button" title="الملف الشخصي" @click="sessionUser ? toast('أهلًا ' + sessionUser.name) : openLogin()">♙</button>
      <button class="icon-button" title="المفضلة" @click="showFavorites = !showFavorites; scrollTo('properties')">
        ♡<sup v-if="favorites.length">{{ favorites.length }}</sup>
      </button>
      <button class="icon-button" title="الإشعارات" @click="notificationsOpen = !notificationsOpen">
        ♧<sup v-if="myNotifications.length">{{ myNotifications.length }}</sup>
      </button>
      <button class="login-button" @click="sessionUser?.role==='owner'?newListing():openEntryChooser">＋ إنشاء إعلان</button>
      <button v-if="sessionUser && sessionUser.role === 'admin'" class="small-button" @click="navigateWorkspace('admin')">لوحة الإدارة</button>
      <button v-else-if="sessionUser && sessionUser.role === 'staff'" class="small-button" @click="navigateWorkspace('staff')">مساحة الموظفين</button>
      <button v-else-if="sessionUser && sessionUser.role === 'owner'" class="small-button" @click="scrollTo('owner-workspace')">لوحة صاحب العقار</button>
      <button v-else-if="sessionUser && sessionUser.role === 'customer'" class="small-button" @click="scrollTo('my-viewings')">متابعة طلباتي</button>
      <button v-else-if="!sessionUser" class="small-button" @click="openEntryChooser">العميل / متابعة الطلب</button>
    </div>

    <div v-if="notificationsOpen" class="notification-popover">
      <div class="row-between">
        <strong>الإشعارات</strong>
        <button class="icon-button" @click="notificationsOpen = false">✕</button>
      </div>
      <p v-if="!myNotifications.length" class="muted">لا توجد إشعارات حاليًا.</p>
      <button v-for="item in myNotifications" :key="item.id" class="notification-item" @click="goToNotification(item)">
        <strong>{{ item.title }}</strong>
        <small>{{ item.description }}</small>
      </button>
    </div>
  </header>

  <main>
    <section v-if="backendError" class="section" style="padding-top:10px;padding-bottom:0"><div class="demo-banner">{{ backendError }}</div></section>
    <!-- الواجهة الرئيسية -->
    <section id="home" class="hero">
      <div class="hero-bg"></div>
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <span class="eyebrow">✦ منصة عقارية ذكية</span>
        <h1>اكتشف منزلك القادم<br><em>مع سمسار</em></h1>
        <p>استكشف عقارات البيع والإيجار، قارن الأسعار والمساحات، ونظّم طلب المعاينة من مكان واحد.</p>
        <div class="hero-actions">
          <a href="#properties" class="primary-button">ابدأ البحث ←</a>
          <button class="outline-button" @click="assistantOpen = true">🤖 اسأل المساعد الذكي</button>
        </div>
        <div class="hero-points">
          <span>✓ تجربة بحث واضحة</span>
          <span>✓ صور وتفاصيل العقارات</span>
          <span>✓ تنظيم طلبات المعاينة</span>
        </div>
      </div>

      <div class="hero-illustration">
        <div class="hero-circle"></div>
        <div class="hero-house">
          <div class="house-roof"></div>
          <div class="house-body">
            <div class="house-windows"><i></i><i></i></div>
            <div class="house-balcony"></div>
            <div class="house-windows"><i></i><i></i></div>
            <div class="house-door"></div>
          </div>
        </div>
        <div class="floating-info info-one"><span>⌖</span><div><strong>المكان المناسب</strong><small>حسب احتياجاتك</small></div></div>
        <div class="floating-info info-two"><span>✓</span><div><strong>طلب معاينة</strong><small>في الموعد اللي يناسبك</small></div></div>
      </div>

      <!-- البحث السريع -->
      <div class="hero-search">
        <label>ابحث عن عقار
          <input v-model.trim="filters.query" placeholder="المنطقة أو اسم العقار..." @keyup.enter="scrollTo('properties')" />
        </label>
        <label>نوع العقار
          <select v-model="filters.type">
            <option value="الكل">كل الأنواع</option>
            <option>شقة</option><option>فيلا</option><option>استوديو</option><option>محل تجاري</option>
          </select>
        </label>
        <label>المنطقة
          <select v-model="filters.area">
            <option value="الكل">كل المناطق</option>
            <option v-for="area in availableAreas" :key="area" :value="area">{{ area }}</option>
          </select>
        </label>
        <label>نوع العملية
          <select v-model="filters.transaction">
            <option value="الكل">بيع أو إيجار</option>
            <option>بيع</option><option>إيجار</option>
          </select>
        </label>
        <button class="primary-button" @click="scrollTo('properties')">⌕ ابحث</button>
      </div>
    </section>

    <!-- المميزات -->
    <section class="features-band">
      <div><span>♢</span><strong>معاملات أوضح</strong><small>تفاصيل في مكان واحد</small></div>
      <div><span>◷</span><strong>تنظيم المعاينة</strong><small>تابع حالة طلبك</small></div>
      <div><span>▣</span><strong>صور العقارات</strong><small>استكشف التفاصيل</small></div>
      <div><span>✧</span><strong>بحث ذكي</strong><small>بمساعدة المساعد</small></div>
    </section>

    <!-- العقارات -->
    <section id="properties" class="section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">اختيارات تناسب احتياجاتك</span>
          <h2>{{ showFavorites ? 'العقارات المحفوظة' : 'أحدث العقارات' }}</h2>
          <p>قارن الصور والمساحات والأسعار والتقييمات قبل طلب المعاينة.</p>
        </div>
        <button v-if="showFavorites" class="outline-light-button" @click="showFavorites = false">عرض كل العقارات</button>
        <span v-else class="demo-badge">بيانات عرض تجريبية</span>
      </div>

      <div class="property-tools">
        <div class="filter-chips">
          <button :class="{active: filters.transaction === 'الكل'}" @click="filters.transaction = 'الكل'">الكل</button>
          <button :class="{active: filters.transaction === 'إيجار'}" @click="filters.transaction = 'إيجار'">للإيجار</button>
          <button :class="{active: filters.transaction === 'بيع'}" @click="filters.transaction = 'بيع'">للبيع</button>
        </div>
        <label class="sort-label">ترتيب حسب
          <select v-model="filters.sort">
            <option value="featured">الأحدث والمميزة</option>
            <option value="price-asc">السعر من الأقل</option>
            <option value="price-desc">السعر من الأعلى</option>
            <option value="rating">أعلى تقييم</option>
          </select>
        </label>
        <strong class="results-count">{{ filteredProperties.length }} عقار</strong>
      </div>

      <div v-if="filteredProperties.length" class="property-grid">
        <article v-for="property in filteredProperties" :key="property.id" class="property-card">
          <div class="property-photo" @click="openProperty(property)">
            <img :src="property.photos[0] || fallbackImage" :alt="property.title" @error="onImageError" />
            <span class="property-badge" :class="property.transaction === 'بيع' ? 'sale-badge' : 'rent-badge'">{{ property.transaction }}</span>
            <span v-if="property.featured && !property.isDemo" class="featured-badge">مميز</span>
            <span v-if="property.isDemo" class="demo-property-badge">عرض تجريبي</span>
            <button class="favorite-button" :class="{favorited: favorites.includes(property.id)}" @click.stop="toggleFavorite(property.id)" :aria-label="'المفضلة ' + property.title">
              {{ favorites.includes(property.id) ? '♥' : '♡' }}
            </button>
            <span class="photo-count">▧ {{ property.photos.length }} صور</span>
          </div>

          <div class="property-content">
            <div class="property-location">⌖ {{ property.area }} - {{ property.neighborhood }}</div>
            <button class="property-title" @click="openProperty(property)">{{ property.title }}</button>
            <div class="rating-inline">
              <span class="stars">{{ starsText(property.rating) }}</span>
              <strong>{{ Number(property.rating || 0).toFixed(1) }}</strong>
              <small>({{ property.reviews || 0 }} تقييم)</small>
            </div>
            <div class="property-specs">
              <span>▦ {{ property.size }} م²</span>
              <span>♙ {{ property.bedrooms }} غرف</span>
              <span>▤ {{ property.bathrooms }} حمام</span>
            </div>
            <div class="property-bottom">
              <div><strong class="property-price">{{ money(property.price) }}</strong><small>{{ property.transaction === 'إيجار' ? 'شهريًا' : 'السعر الإجمالي' }}</small></div>
              <button class="details-button" @click="openProperty(property)">التفاصيل ←</button>
            </div>
          </div>
        </article>
      </div>

      <div v-else class="empty-state">
        <span class="empty-symbol">⌕</span>
        <h3>{{ showFavorites ? 'المفضلة فارغة' : 'ملقيناش عقار بالمواصفات دي' }}</h3>
        <p>جرّب تغيير البحث أو الفلاتر.</p>
        <button class="outline-light-button" @click="resetFilters">إعادة ضبط البحث</button>
      </div>
    </section>

    <!-- خطوات الاستخدام -->
    <section id="how-it-works" class="how-section">
      <div class="section-heading centered">
        <div><span class="eyebrow">خطوات أوضح ووقت أقل</span><h2>رحلتك لعقارك في 3 خطوات</h2><p>من البحث الأول لحد تنسيق موعد المعاينة.</p></div>
      </div>
      <div class="steps-grid">
        <article class="step-card"><span class="step-no">01</span><div class="step-icon">⌕</div><h3>حدد مواصفاتك</h3><p>اختار المنطقة والميزانية ونوع العقار اللي يناسبك.</p></article>
        <article class="step-card"><span class="step-no">02</span><div class="step-icon">⌂</div><h3>استكشف وقارن</h3><p>شوف الصور والمساحة والسعر والتقييمات في مكان واحد.</p></article>
        <article class="step-card"><span class="step-no">03</span><div class="step-icon">◷</div><h3>اطلب معاينة</h3><p>حدد الموعد والمالك يراجع الطلب أو يقترح موعدًا بديلًا.</p></article>
      </div>
    </section>

    <!-- طلبات العميل -->
    <section v-if="sessionUser && sessionUser.role === 'customer'" id="my-viewings" class="section tinted-section">
      <div class="section-heading"><div><span class="eyebrow">تابع خطواتك</span><h2>طلبات المعاينة</h2></div></div>
      <label class="order-lookup-label">رقم الطلب لمتابعته<input v-model.trim="customerOrderLookup" placeholder="اكتب أول 8 خانات من رقم الطلب" maxlength="36" /></label>
      <div v-if="customerViewingsForLookup.length" class="record-grid">
        <article v-for="request in customerViewingsForLookup" :key="request.id" class="record-card">
          <div class="row-between"><strong>{{ getProperty(request.propertyId)?.title || 'عقار' }}</strong><span class="status-pill">{{ request.status }}</span></div>
          <p><strong>رقم الطلب:</strong> {{ request.id.slice(0,8).toUpperCase() }}</p>
          <p><strong>السعر:</strong> {{ money(getProperty(request.propertyId)?.price) }}</p>
          <p><strong>العنوان:</strong> {{ getProperty(request.propertyId)?.address || getProperty(request.propertyId)?.area || '—' }}</p>
          <p>الموعد المطلوب: {{ request.date }} — {{ request.time }}</p>
          <p v-if="request.alternateDate">الموعد البديل: {{ request.alternateDate }} — {{ request.alternateTime }}</p>
          <div class="inline-actions">
            <button v-if="request.status === 'موعد بديل مقترح'" class="primary-button" @click="acceptAlternate(request)">قبول الموعد البديل</button>
            <button v-if="!['ملغاة من العميل','مرفوضة من المالك','اكتملت المعاينة'].includes(request.status)" class="danger-button" @click="cancelViewing(request)">إلغاء الطلب</button>
          </div>
        </article>
      </div>
      <div v-else class="empty-state">{{ customerOrderLookup ? 'مش لاقيين طلب بالرقم ده في حسابك.' : 'لسه ما قدمتش طلبات معاينة.' }}</div>
    </section>

    <!-- استفسارات العميل المسجلة على حسابه -->
    <section v-if="sessionUser && sessionUser.role === 'customer'" class="section tinted-section" id="my-inquiries"><div class="section-heading"><div><span class="eyebrow">متابعة من حسابك</span><h2>استفساراتي العقارية</h2><p>كل استفسار يمر بمراجعة الموظف ثم رد المالك ثم الرد النهائي من فريق سمسار.</p></div></div><div v-if="customerInquiries.length" class="record-grid"><article v-for="inquiry in customerInquiries" :key="inquiry.id" class="inquiry-card"><h4>{{ inquiry.propertyTitle || 'العقار' }}</h4><div class="inquiry-meta"><span>الحالة: {{ inquiry.statusLabel }}</span><span>{{ new Date(inquiry.createdAt).toLocaleDateString('ar-EG') }}</span></div><div class="inquiry-message">{{ inquiry.question }}</div><div v-if="inquiry.responseToCustomer" class="inquiry-response"><strong>رد فريق سمسار:</strong><p>{{ inquiry.responseToCustomer }}</p></div></article></div><div v-else class="empty-state">لا توجد استفسارات حتى الآن. افتح عقارًا منشورًا واضغط «استفسار عبر سمسار».</div></section>

    <!-- محفوظات المساعد الذكي على حساب العميل -->
    <section v-if="sessionUser && sessionUser.role === 'customer'" class="section tinted-section" id="my-ai-conversations"><div class="section-heading"><div><span class="eyebrow">سجل حسابك</span><h2>محادثاتي مع المساعد الذكي</h2><p>المحادثات الخارجية الناجحة تُحفظ هنا مع سياق الإعلان عند توفره.</p></div><button class="outline-light-button" @click="loadAIHistory">تحديث السجل</button></div><div v-if="aiHistoryBusy" class="muted">جارٍ تحميل المحادثات...</div><div v-else-if="aiConversations.length" class="record-grid"><article v-for="conversation in aiConversations" :key="conversation.id" class="inquiry-card"><h4>{{ conversation.propertyTitle || 'محادثة بحث عامة' }}</h4><div class="inquiry-meta"><span>{{ conversation.isDemo ? 'سياق إعلان تجريبي' : conversation.propertyId ? 'مرتبطة بإعلان' : 'بحث عام' }}</span><span>{{ conversation.lastMessageAt ? new Date(conversation.lastMessageAt).toLocaleString('ar-EG') : new Date(conversation.createdAt).toLocaleString('ar-EG') }}</span></div><button class="primary-button" @click="openSavedAIConversation(conversation)">عرض المحادثة والردود</button></article></div><div v-else class="empty-state">لا توجد محادثات ذكاء اصطناعي محفوظة. بعد تهيئة المساعد الخارجي وتسجيل الدخول، ستظهر المحادثات هنا.</div></section>

    <!-- مساحة المالك -->
    <section v-if="sessionUser && sessionUser.role === 'owner'" id="owner-workspace" class="section tinted-section">
      <div class="section-heading">
        <div><span class="eyebrow">مساحة المالك</span><h2>إعلاناتي وطلبات المعاينة</h2><p>أضف عقاراتك وتابع طلبات المعاينة المرتبطة بها.</p></div>
        <button class="primary-button" @click="newListing">＋ إضافة عقار</button>
      </div>

      <div class="owner-stats">
        <div><small>إعلاناتي</small><strong>{{ ownerProperties.length }}</strong></div>
        <div><small>طلبات المعاينة</small><strong>{{ ownerViewings.length }}</strong></div>
        <div><small>بانتظار الرد</small><strong>{{ ownerPendingViewings.length }}</strong></div>
      </div>

      <div class="section-heading" style="margin-top:24px"><div><span class="eyebrow">تواصل من خلال المنصة</span><h3>استفسارات العملاء المحوّلة إليّ</h3><p>رد على سؤال العميل من داخل سمسار؛ لا تظهر أرقام هواتف الأطراف في صندوق الاستفسارات.</p></div></div><div v-if="ownerInquiries.length" class="record-grid"><article v-for="inquiry in ownerInquiries" :key="inquiry.id" class="inquiry-card"><h4>{{ inquiry.propertyTitle || 'العقار' }}</h4><div class="inquiry-meta"><span>الحالة: {{ inquiry.statusLabel }}</span><span>رقم الطلب {{ inquiry.id.slice(0,8) }}</span></div><div class="inquiry-message">{{ inquiry.question }}</div><div v-if="inquiry.status==='waiting_owner'"><label>ردك لفريق سمسار *<textarea v-model.trim="ownerInquiryDrafts[inquiry.id]" rows="3" maxlength="2000" placeholder="اكتب تفاصيل السعر أو التوافر أو الموعد..."></textarea></label><button class="primary-button" @click="submitOwnerInquiryResponse(inquiry)" :disabled="!ownerInquiryDrafts[inquiry.id]">إرسال الرد لفريق سمسار</button></div><div v-else-if="inquiry.ownerResponse" class="inquiry-response">تم إرسال ردك لفريق سمسار.</div></article></div><div v-else class="empty-state">لا توجد استفسارات محوّلة إليك حاليًا.</div>

      <div v-if="listingFormOpen" class="form-panel">
        <div class="row-between"><h3>{{ editingListingId ? 'تعديل العقار' : 'إضافة عقار جديد' }}</h3><button class="close-button" @click="cancelListingForm">✕</button></div>
        <form @submit.prevent="saveListing">
          <div class="form-grid">
            <label>عنوان الإعلان *<input v-model.trim="listingForm.title" required maxlength="120" /></label>
            <label>نوع العملية *<select v-model="listingForm.transaction"><option>إيجار</option><option>بيع</option></select></label>
            <label>السعر بالجنيه *<input v-model.number="listingForm.price" type="number" min="1" required /></label>
            <label>السعر المقترح<input v-model.number="listingForm.suggestedPrice" type="number" min="0" /></label>
            <label>المحافظة أو المدينة *<input v-model.trim="listingForm.area" required placeholder="القاهرة" /></label>
            <label>المنطقة أو الحي *<input v-model.trim="listingForm.neighborhood" required placeholder="مدينة نصر" /></label>
            <label class="wide-label">العنوان التفصيلي *<input v-model.trim="listingForm.addressText" required maxlength="250" placeholder="الشارع، رقم المبنى، أقرب علامة مميزة" /></label>
            <label>نوع العقار *<select v-model="listingForm.type"><option>شقة</option><option>فيلا</option><option>استوديو</option><option>محل تجاري</option></select></label>
            <label>المساحة بالمتر *<input v-model.number="listingForm.size" type="number" min="1" required /></label>
            <label>عدد غرف النوم<input v-model.number="listingForm.bedrooms" type="number" min="0" /></label>
            <label>عدد الحمامات<input v-model.number="listingForm.bathrooms" type="number" min="0" /></label>
            <label>رابط الخريطة (اختياري)<input v-model.trim="listingForm.mapUrl" type="url" placeholder="https://..." /></label>
            <label>تفاصيل العقد<input v-model.trim="listingForm.contractDetails" maxlength="250" /></label>
          </div>

          <label class="wide-label">وصف العقار *<textarea v-model.trim="listingForm.description" rows="4" maxlength="2000" required></textarea></label>
          <label class="wide-label">الخدمات القريبة<input v-model.trim="listingForm.amenitiesText" placeholder="مواصلات، مدارس، سوق..." /></label>

          <div class="upload-panel">
            <div><strong>صور العقار — حتى 10 صور</strong><p class="muted">اضغط على علامة + لاختيار الصور من جهازك. الصور تُضغط تلقائيًا للمعاينة.</p></div>
            <label class="upload-trigger"><span>＋</span> اختيار الصور من الجهاز
              <input type="file" accept="image/*" multiple @change="onListingImages" />
            </label>
            <div class="upload-count">{{ listingForm.previewImages.length }} / 10 صور</div>
            <div class="upload-grid">
              <div v-for="(photo,index) in listingForm.previewImages" :key="photo.key" class="upload-thumb">
                <img :src="photo.src" :alt="'صورة عقار ' + (index+1)" />
                <span v-if="index === 0" class="main-photo-tag">الصورة الرئيسية</span>
                <button type="button" @click="removeListingImage(index)" title="حذف الصورة">✕</button>
              </div>
            </div>
            <p class="hint">في هذه النسخة، الصور محفوظة على المتصفح فقط وليست مرفوعة لخادم سحابي.</p>
          </div>

          <div class="upload-panel">
            <strong>مستندات المالك والعقار</strong>
            <div class="form-grid">
              <label>مستند الهوية<input type="file" accept="image/*,.pdf" @change="onDocumentSelect($event,'identity')" /><small>{{ listingForm.identityDocName || 'لم يتم اختيار ملف' }}</small></label>
              <label>مستند إثبات الملكية<input type="file" accept="image/*,.pdf" @change="onDocumentSelect($event,'ownership')" /><small>{{ listingForm.ownershipDocName || 'لم يتم اختيار ملف' }}</small></label>
            </div>
            <p class="hint">يُسجَّل اسم الملف فقط في النسخة الحالية. لا تستخدم مستندات شخصية حقيقية قبل إعداد تخزين آمن.</p>
          </div>

          <div class="policy-note">رسوم إنشاء الإعلان <strong>{{ money(paymentPolicy.owner_listing_fee_egp) }}</strong>. بعد حفظ البيانات ستنتقل لاختيار وسيلة الدفع ورفع الإثبات. يظل الإعلان مسودة حتى مراجعة الدفع وموافقة الإدارة.</div>
          <div class="inline-actions"><button class="primary-button" type="submit">حفظ الإعلان والانتقال إلى الدفع</button><button class="outline-light-button" type="button" @click="cancelListingForm">إلغاء</button></div>
        </form>
      </div>

      <h3 class="subheading">إعلاناتي</h3>
      <div v-if="ownerProperties.length" class="owner-list-grid">
        <article v-for="property in ownerProperties" :key="property.id" class="owner-card">
          <img :src="property.photos[0] || fallbackImage" :alt="property.title" @error="onImageError" />
          <div class="owner-card-content">
            <span class="status-pill">{{ property.status }}</span>
            <h4>{{ property.title }}</h4>
            <p>{{ property.area }}، {{ property.neighborhood }}</p>
            <strong>{{ money(property.price) }}</strong>
            <div class="inline-actions">
              <button class="outline-light-button" @click="openProperty(property)">عرض</button>
              <button class="outline-light-button" @click="editListing(property)">تعديل</button>
              <button class="danger-button" @click="deleteListing(property)">حذف</button>
            </div>
          </div>
        </article>
      </div>
      <div v-else class="empty-state">لسه مفيش إعلانات مرتبطة بالحساب ده.</div>

      <h3 class="subheading">طلبات معاينة عقاراتي</h3>
      <div v-if="ownerViewings.length" class="record-grid">
        <article v-for="request in ownerViewings" :key="request.id" class="record-card">
          <div class="row-between"><strong>{{ getProperty(request.propertyId)?.title || 'عقار' }}</strong><span class="status-pill">{{ request.status }}</span></div>
          <p>العميل: {{ request.customerName }} — {{ request.phone }}</p>
          <p>الموعد: {{ request.date }} — {{ request.time }}</p>
          <div class="inline-actions">
            <button v-if="request.status === 'بانتظار موافقة المالك'" class="primary-button" @click="updateViewingStatus(request,'تمت الموافقة من المالك')">الموافقة</button>
            <button v-if="request.status === 'بانتظار موافقة المالك'" class="danger-button" @click="updateViewingStatus(request,'مرفوضة من المالك')">رفض</button>
            <button v-if="request.status === 'بانتظار موافقة المالك'" class="outline-light-button" @click="openAlternateForm(request)">موعد بديل</button>
          </div>
          <div v-if="alternateFormId === request.id" class="form-grid alternate-form">
            <label>التاريخ البديل<input v-model="alternateDate" type="date" :min="today" required /></label>
            <label>الوقت البديل<select v-model="alternateTime"><option>10:00</option><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option></select></label>
            <button class="primary-button" @click="suggestAlternate(request)">إرسال الموعد</button>
          </div>
        </article>
      </div>
      <div v-else class="empty-state">لا توجد طلبات معاينة على إعلاناتك حتى الآن.</div>
    </section>

    <!-- قسم تعريفي -->
    <section id="about" class="about-strip">
      <div><span class="eyebrow">عن سمسار</span><h2>نقرّب لك الطريق من البحث للمعاينة</h2><p>واجهة تجريبية لمنصة عقارية تساعد على تنظيم استكشاف العقارات وطلبات المعاينة.</p></div>
      <button class="primary-button" @click="assistantOpen = true">تحدث مع المساعد الذكي</button>
    </section>
  </main>

  <!-- تذييل الصفحة -->
  <footer id="contact" class="footer">
    <div class="footer-main"><a href="#home" class="brand"><span class="brand-mark">⌂</span><span><strong>{{ settings.name }}</strong><small>عقارك أقرب وأسهل</small></span></a><p>{{ settings.tagline }}</p></div>
    <div class="footer-links"><a href="#properties">استكشاف العقارات</a><a href="#how-it-works">خدماتنا</a><button @click="assistantOpen = true">المساعد الذكي</button><button class="whatsapp-link" @click="openWhatsApp()">تواصل معنا عبر واتساب</button><a v-if="siteContactSettings.facebook_url" :href="siteContactSettings.facebook_url" target="_blank" rel="noopener noreferrer">فيسبوك الرسمي</a><a v-if="siteContactSettings.official_website_url" :href="siteContactSettings.official_website_url" target="_blank" rel="noopener noreferrer">الموقع الرسمي</a><button @click="openLogin">دخول الحسابات</button></div><div v-if="siteContactSettings.qr_target_url" class="footer-qr"><a :href="siteContactSettings.qr_target_url" target="_blank" rel="noopener noreferrer"><img :src="'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent(siteContactSettings.qr_target_url)" alt="رمز QR لفتح موقع سمسار" loading="lazy" /></a><span>امسح الرمز لفتح الموقع</span></div>
    <div class="footer-bottom"><small>© {{ currentYear }} {{ settings.name }}</small><small>العقارات التجريبية موضّحة بوضوح؛ الطلبات الحقيقية تعتمد على العقارات المنشورة.</small></div>
  </footer>

  <!-- شريط تنقل الموبايل -->
  <nav class="mobile-bottom-nav">
    <button :class="{active: mobileNav === 'home'}" @click="mobileNav='home'; scrollTo('home')"><span>⌂</span><small>الرئيسية</small></button>
    <button :class="{active: mobileNav === 'search'}" @click="mobileNav='search'; scrollTo('properties')"><span>⌕</span><small>العقارات</small></button>
    <button :class="{active: mobileNav === 'assistant'}" @click="mobileNav='assistant'; assistantOpen = true"><span>🤖</span><small>المساعد</small></button>
    <button :class="{active: mobileNav === 'favorites'}" @click="mobileNav='favorites'; showFavorites=true; scrollTo('properties')"><span>♡</span><small>المفضلة</small></button>
    <button :class="{active: mobileNav === 'account'}" @click="mobileNav='account'; sessionUser ? toast(sessionUser.name) : openLogin()"><span>♙</span><small>حسابي</small></button>
  </nav>

  <!-- المساعد الذكي للعملاء -->
  <button class="assistant-fab" @click="assistantOpen = !assistantOpen"><span>🤖</span> المساعد الذكي</button>
  <div v-if="assistantOpen" class="assistant-panel">
    <div class="assistant-header"><span class="robot-avatar">🤖</span><div><strong>المساعد الذكي</strong><small>{{ aiSettings.enabled ? 'المساعد الخارجي حسب إعدادات الربط' : 'المساعد الخارجي غير مفعّل بعد' }}</small></div><button @click="assistantOpen=false">✕</button></div>
    <div class="assistant-messages">
      <div class="bot-message">أهلًا بيك! قول لي بتدور على إيه، زي شقة للإيجار أو عقار للبيع في القاهرة.</div>
      <div v-for="(message,index) in assistantMessages" :key="index" :class="message.from === 'user' ? 'user-message' : 'bot-message'">{{ message.text }}</div>
    </div>
    <div class="assistant-shortcuts"><button @click="quickAsk('شقة للإيجار')">شقة للإيجار</button><button @click="quickAsk('عقار للبيع')">عقار للبيع</button><button @click="quickAsk('إزاي أطلب معاينة؟')">طلب معاينة</button></div>
    <form class="assistant-input" @submit.prevent="askAssistant"><input v-model.trim="assistantInput" maxlength="1200" placeholder="اكتب سؤالك عن العقار أو متطلباتك..." /><button type="submit" :disabled="assistantBusy">{{ assistantBusy ? '…' : '➤' }}</button></form>
    <small class="assistant-note">{{ assistantPropertyId ? 'المحادثة مرتبطة بإعلان محدد؛ لا يتم عرض هاتف المالك.' : 'لا يدخل رقم المالك أو معلومات الاتصال الخاصة في سياق المساعد.' }}</small>
  </div>

  <!-- تفاصيل العقار والتقييم -->
  <div v-if="selectedProperty" class="overlay" @click.self="selectedProperty=null">
    <section class="modal property-modal">
      <div class="modal-heading"><div><span class="eyebrow">{{ selectedProperty.transaction }} · {{ selectedProperty.type }}</span><h2>{{ selectedProperty.title }}</h2><p>⌖ {{ selectedProperty.area }} — {{ selectedProperty.neighborhood }}</p></div><button class="close-button" @click="selectedProperty=null">✕</button></div>
      <div class="detail-gallery"><img v-for="(photo,index) in selectedProperty.photos" :key="photo.key || photo + index" :src="photo.src || photo" :alt="'صورة ' + (index+1)" @error="onImageError" /></div>
      <div class="detail-price"><strong>{{ money(selectedProperty.price) }}</strong><small>{{ selectedProperty.transaction === 'إيجار' ? 'شهريًا' : 'السعر الإجمالي' }}</small></div>

                  <label>المحافظة أو المدينة *<input v-model.trim="listingForm.area" required /></label><label>المنطقة أو الحي *<input v-model.trim="listingForm.neighborhood" required /></label><label class="wide-label">العنوان التفصيلي *<input v-model.trim="listingForm.addressText" required maxlength="250" /></label>

                  <label>غرف النوم<input v-model.number="listingForm.bedrooms" type="number" min="0" /></label><label>الحمامات<input v-model.number="listingForm.bathrooms" type="number" min="0" /></label>
                  <label>رابط الخريطة<input v-model.trim="listingForm.mapUrl" type="url" /></label><label>تفاصيل العقد<input v-model.trim="listingForm.contractDetails" maxlength="250" /></label>
                </div>
                <label class="wide-label">الوصف *<textarea v-model.trim="listingForm.description" rows="4" required maxlength="2000"></textarea></label><label class="wide-label">الخدمات القريبة<input v-model.trim="listingForm.amenitiesText" placeholder="مواصلات، مدارس، سوق..." /></label>
                <div class="upload-panel"><div class="row-between"><div><strong>صور الإعلان</strong><p class="muted">أضف صورًا من جهازك أو احذف الصور الحالية.</p></div><label class="upload-trigger">＋ اختيار الصور<input type="file" accept="image/*" multiple @change="onListingImages" /></label></div><div class="upload-count">{{ listingForm.previewImages.length }} / 10 صور</div><div class="upload-grid"><div v-for="(photo,index) in listingForm.previewImages" :key="photo.key" class="upload-thumb"><img :src="photo.src" :alt="'صورة إعلان '+(index+1)" @error="onImageError" /><span v-if="index===0" class="main-photo-tag">الصورة الرئيسية</span><button type="button" @click="removeListingImage(index)">✕</button></div></div><p class="hint">الصور الجديدة تُرفع إلى تخزين سمسار بعد الحفظ. لا ترفع مستندات شخصية حساسة من هذا النموذج.</p></div>
                <div class="form-grid"><label>حالة الإعلان<select v-model="adminListingStatus"><option value="draft">مسودة</option><option value="pending_review">قيد المراجعة</option><option value="published">منشور</option><option value="rejected">مرفوض</option><option value="rented">مؤجر / مباع</option><option value="archived">مؤرشف / متوقف</option></select></label><label class="checkbox-line"><input v-model="listingForm.isDemo" type="checkbox" /> إعلان تجريبي (لا يمثل عقارًا حقيقيًا)</label></div>

              <select :value="property.isBackendRecord ? property.backendStatus : property.status" @change="changeListingStatus(property.id,$event.target.value)"><option value="draft" :disabled="sessionUser?.role!=='admin'">مسودة</option><option value="pending_review">قيد المراجعة</option><option value="published" :disabled="sessionUser?.role!=='admin'">منشور</option><option value="rejected" :disabled="sessionUser?.role!=='admin'">مرفوض</option><option value="rented">مباع / مؤجر</option><option value="archived">مؤرشف / متوقف</option></select>
              <button class="outline-light-button" @click="openProperty(property)">عرض</button><button v-if="sessionUser?.role==='admin'" class="outline-light-button" @click="editListing(property)">تعديل</button><button v-if="sessionUser?.role==='admin'" class="danger-button" @click="deleteListing(property)">حذف</button>

          <div v-if="adminTab === 'viewings'" class="admin-content"><h3>طلبات المعاينة</h3><p class="muted">تقدر الإدارة والموظفون المعتمدون يتابعوا الطلبات. الإلغاء يظل متاحًا للعميل والمدير.</p><article v-for="request in viewings" :key="request.id" class="admin-record"><div class="row-between"><strong>{{ getProperty(request.propertyId)?.title || 'عقار' }}</strong><span class="status-pill">{{ request.status }}</span></div><p><strong>رقم الطلب:</strong> {{ request.id.slice(0,8).toUpperCase() }}</p><p>العميل: {{ request.customerName }} · {{ request.phone }}</p><p>الموعد: {{ request.date }} — {{ request.time }}</p><p v-if="request.alternateDate">الموعد البديل: {{ request.alternateDate }} — {{ request.alternateTime }}</p><div class="inline-actions"><select :value="request.status" @change="updateViewingStatus(request,$event.target.value)"><option disabled>بانتظار موافقة المالك</option><option>تمت الموافقة من المالك</option><option disabled>موعد بديل مقترح</option><option disabled>تم قبول الموعد البديل</option><option>مرفوضة من المالك</option><option v-if="sessionUser?.role === 'admin'">ملغاة من العميل</option><option>اكتملت المعاينة</option></select><button v-if="['admin','staff'].includes(sessionUser?.role) && !['ملغاة من العميل','مرفوضة من المالك','اكتملت المعاينة'].includes(request.status)" class="outline-light-button" @click="openAlternateForm(request)">اقتراح موعد بديل</button></div><div v-if="alternateFormId === request.id" class="form-grid alternate-form"><label>التاريخ البديل<input v-model="alternateDate" type="date" :min="today" required /></label><label>الوقت البديل<select v-model="alternateTime"><option>10:00</option><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option></select></label><button class="primary-button" @click="suggestAlternate(request)">إرسال الموعد البديل</button></div></article><p v-if="!viewings.length" class="muted">لا توجد طلبات معاينة.</p></div>

          <div v-if="adminTab === 'inquiries'" class="admin-content"><h3>صندوق استفسارات العملاء</h3><p class="muted">لا تظهر أرقام أصحاب العقارات للعميل. وافق على الاستفسار لتحويله إلى مالك الإعلان من خلال حسابه، ثم راجع رد المالك واكتب الرد النهائي للعميل.</p><div v-if="staffInquiries.length" class="staff-inquiry-grid"><article v-for="inquiry in staffInquiries" :key="inquiry.id" class="inquiry-card"><div class="row-between"><h4>{{ inquiry.propertyTitle || 'عقار' }}</h4><span class="status-pill">{{ inquiry.statusLabel }}</span></div><div class="inquiry-meta"><span>الطلب {{ inquiry.id.slice(0,8) }}</span><span>{{ new Date(inquiry.createdAt).toLocaleString('ar-EG') }}</span></div><div class="inquiry-message">{{ inquiry.question }}</div><div v-if="inquiry.ownerResponse" class="inquiry-response"><strong>رد المالك الداخلي (لا يظهر للعميل قبل مراجعتك):</strong><p>{{ inquiry.ownerResponse }}</p></div><div v-if="inquiry.responseToCustomer" class="inquiry-response"><strong>الرد المرسل للعميل:</strong><p>{{ inquiry.responseToCustomer }}</p></div><div v-if="inquiry.status==='new'"><label>ملاحظة المراجع / سبب الرفض إذا لزم<textarea v-model.trim="inquiryDrafts[inquiry.id]" rows="2" maxlength="1000" placeholder="يظهر هذا النص للعميل فقط عند الرفض..."></textarea></label><div class="inline-actions"><button class="primary-button" @click="approveInquiry(inquiry)">مراجعة والموافقة وإرساله للمالك</button><button class="danger-button" @click="rejectInquiry(inquiry)">رفض مع إرسال السبب</button></div></div><div v-if="inquiry.status==='owner_replied'"><label>الرد النهائي للعميل *<textarea v-model.trim="inquiryDrafts[inquiry.id]" rows="3" maxlength="2000" placeholder="صغ الرد للعميل من المعلومات التي أرسلها المالك..."></textarea></label><button class="primary-button" @click="replyToCustomerInquiry(inquiry)" :disabled="!inquiryDrafts[inquiry.id]">إرسال الرد لحساب العميل</button></div></article></div><div v-else class="empty-state">لا توجد استفسارات. ستظهر هنا طلبات العملاء الحقيقيين عن الإعلانات المنشورة.</div></div>

          <div v-if="adminTab === 'customers'" class="admin-content"><h3>المستخدمون والصلاحيات</h3><p class="muted">الحسابات الحقيقية في قاعدة البيانات. الحساب الجديد يبدأ كعميل، وتظهر شارة «جديد» للحسابات المسجلة خلال آخر 7 أيام.</p><div class="staff-summary-grid"><div class="staff-summary-card"><span>كل الحسابات</span><strong>{{ backendProfiles.length }}</strong></div><div class="staff-summary-card"><span>عملاء</span><strong>{{ backendProfiles.filter(item=>item.role==='customer').length }}</strong></div><div class="staff-summary-card"><span>تسجيلات جديدة · 7 أيام</span><strong>{{ backendProfiles.filter(item=>item.role==='customer' && isNewProfile(item)).length }}</strong></div><div class="staff-summary-card"><span>أصحاب عقارات</span><strong>{{ backendProfiles.filter(item=>item.role==='owner').length }}</strong></div></div><article v-for="profile in backendProfiles" :key="profile.id" class="admin-list-item"><span class="avatar">{{ (profile.full_name || profile.phone || 'م').slice(0,1) }}</span><div class="admin-list-main"><strong>{{ profile.full_name || 'اسم غير مسجل' }} <span v-if="profile.role==='customer' && isNewProfile(profile)" class="staff-status-pill">تسجيل جديد</span><span v-if="profile.role==='customer' && profile.requested_role==='owner'" class="staff-status-pill">طلب اعتماد مالك</span></strong><small>{{ profile.phone || profile.whatsapp_phone || 'لا يوجد رقم هاتف' }}</small><small>{{ profile.address_text || 'العنوان غير مسجل' }}</small><small>{{ profile.role }} · {{ profile.created_at ? new Date(profile.created_at).toLocaleDateString('ar-EG') : '—' }}</small></div><button v-if="profile.role==='customer' && profile.requested_role==='owner'" class="primary-button" :disabled="roleUpdateBusyId===profile.id" @click="updateProfileRole(profile,'owner')">اعتماد كمالك</button><label class="role-select-label">الصلاحية<select :value="profile.role" :disabled="profile.id === sessionUser?.id || roleUpdateBusyId === profile.id" @change="updateProfileRole(profile,$event.target.value)"><option value="customer">عميل</option><option value="owner">مالك</option><option value="staff">موظف</option></select></label></article><div v-if="!backendProfiles.length" class="empty-state">لا توجد حسابات للعرض أو أن حسابك ليس مدير النظام.</div><div class="policy-note">لا يمكن تغيير صلاحية مدير النظام الحالي من هنا، ولا يمكن إنشاء مدير جديد من التسجيل العام.</div></div>

          <div v-if="adminTab === 'staff'" class="admin-content staff-management">
            <div class="row-between staff-heading"><div><h3>إدارة فريق العمل والصلاحيات</h3><p class="muted">بطاقة مستقلة لكل موظف، والصلاحيات تتحدد لكل حساب على حدة.</p></div><button class="outline-light-button" @click="loadBackendProfiles">تحديث البيانات</button></div>
            <div class="staff-summary-grid">
              <div class="staff-summary-card"><span>إجمالي الموظفين</span><strong>{{ backendProfiles.filter(item => item.role === 'staff').length }}</strong></div>
              <div class="staff-summary-card"><span>صلاحية الاستفسارات</span><strong>{{ backendProfiles.filter(item => item.role === 'staff' && item.staff_permissions?.inquiries === true).length }}</strong></div>
              <div class="staff-summary-card"><span>صلاحية المعاينات</span><strong>{{ backendProfiles.filter(item => item.role === 'staff' && item.staff_permissions?.viewings === true).length }}</strong></div>

            </div>
            <label class="staff-search-label">بحث في الموظفين<input v-model.trim="staffSearch" type="search" placeholder="ابحث بالاسم أو الهاتف..." /></label>
            <div class="staff-card-grid">
              <article v-for="profile in backendProfiles.filter(item => item.role === 'staff').filter(item => !staffSearch || [item.full_name,item.phone,item.whatsapp_phone].some(value => String(value || '').toLocaleLowerCase('ar').includes(staffSearch.toLocaleLowerCase('ar'))))" :key="profile.id" class="staff-profile-card">
                <div class="staff-card-top"><span class="avatar staff-avatar">{{ (profile.full_name || profile.phone || 'م').slice(0,1) }}</span><div class="staff-identity"><strong>{{ profile.full_name || 'اسم غير مسجل' }}</strong><small>{{ profile.phone || profile.whatsapp_phone || 'لا يوجد رقم هاتف' }}</small><small>انضم {{ profile.created_at ? new Date(profile.created_at).toLocaleDateString('ar-EG') : '—' }}</small></div><span class="staff-role-badge">موظف</span></div>
                <div class="staff-permission-list">
                  <div class="staff-permission-heading"><strong>صلاحيات الوصول</strong><small>{{ ['inquiries','viewings','ai_assistant','listings_review','operations'].filter(key => profile.staff_permissions?.[key] === true).length }} من 5 مفعّلة</small></div>
                  <label class="checkbox-line"><input type="checkbox" :checked="profile.staff_permissions?.inquiries===true" :disabled="roleUpdateBusyId===profile.id" @change="updateStaffPermission(profile,'inquiries',$event.target.checked)" /> <span><strong>استفسارات العملاء</strong><small>مراجعة الاستفسارات وإرسال الردود للعملاء.</small></span></label>
                  <label class="checkbox-line"><input type="checkbox" :checked="profile.staff_permissions?.viewings===true" :disabled="roleUpdateBusyId===profile.id" @change="updateStaffPermission(profile,'viewings',$event.target.checked)" /> <span><strong>طلبات المعاينة</strong><small>متابعة المواعيد وتحديث حالات الطلبات.</small></span></label>
                  <label class="checkbox-line"><input type="checkbox" :checked="profile.staff_permissions?.ai_assistant===true" :disabled="roleUpdateBusyId===profile.id" @change="updateStaffPermission(profile,'ai_assistant',$event.target.checked)" /> <span><strong>مساعد الموظفين الذكي</strong><small>استخدام المساعد الداخلي للمساندة التشغيلية.</small></span></label>
                  <label class="checkbox-line"><input type="checkbox" :checked="profile.staff_permissions?.listings_review===true" :disabled="roleUpdateBusyId===profile.id" @change="updateStaffPermission(profile,'listings_review',$event.target.checked)" /> <span><strong>مراجعة الإعلانات</strong><small>الاطلاع على الإعلانات غير المنشورة للمراجعة.</small></span></label>
                  <label class="checkbox-line"><input type="checkbox" :checked="profile.staff_permissions?.operations===true" :disabled="roleUpdateBusyId===profile.id" @change="updateStaffPermission(profile,'operations',$event.target.checked)" /> <span><strong>المهام التشغيلية</strong><small>إدارة المهام المسندة وسير العمل.</small></span></label>

              </article>
            </div>
            <div v-if="!backendProfiles.some(item => item.role === 'staff')" class="empty-state">لا توجد حسابات موظفين حتى الآن. من تبويب «المستخدمون» عيّن حسابًا موجودًا كموظف.</div>
            <div v-else-if="!backendProfiles.filter(item => item.role === 'staff').some(item => !staffSearch || [item.full_name,item.phone,item.whatsapp_phone].some(value => String(value || '').toLocaleLowerCase('ar').includes(staffSearch.toLocaleLowerCase('ar'))))" class="empty-state">لا توجد نتائج مطابقة للبحث.</div>
            <div class="policy-note">الأمان: صلاحيات الموظفين لا تمنحهم صلاحية مدير النظام. اختبر كل حساب موظف بعد تغيير الصلاحيات للتأكد من أن الوصول مطابق للخيارات المحددة.</div>
          </div>

          <div v-if="adminTab === 'assistant'" class="admin-content"><h3>مساعد الموظفين</h3><p class="muted">{{ aiSettings.enabled ? 'المساعد الخارجي مهيّأ للإرسال؛ يحتاج إلى مفتاح API سري صالح.' : 'المساعد الخارجي غير مفعّل. يمكن تفعيله بعد إدخال عنوان المزود واسم النموذج وضبط المفتاح السري في Supabase.' }}</p><form class="assistant-input" @submit.prevent="askStaffAssistant"><input v-model.trim="staffAssistantInput" placeholder="اكتب سؤالًا عن الطلبات أو الإعلانات..." maxlength="300" /><button type="submit">اسأل</button></form><div v-if="staffAssistantReply" class="assistant-reply">{{ staffAssistantReply }}</div></div>

          <div v-if="adminTab === 'refunds'" class="admin-content"><h3>رسوم الخدمة وسياسة الاسترداد</h3><form class="admin-form" @submit.prevent="saveSettings"><label>رسوم إنشاء إعلان المالك (جنيه)<input v-model.number="paymentPolicy.owner_listing_fee_egp" type="number" min="1" step="1" /></label><label>رسوم خدمة العميل (جنيه)<input v-model.number="paymentPolicy.customer_service_fee_egp" type="number" min="0" step="1" /></label><label>نسبة الاسترداد للعميل (%)<input v-model.number="paymentPolicy.refund_customer_percent" type="number" min="0" max="100" step="1" /></label><label>النسبة المحتفظ بها كرسوم دعم (%)<input v-model.number="paymentPolicy.refund_support_percent" type="number" min="0" max="100" step="1" /></label><div class="policy-card"><div><span>قيمة الاسترداد عند استحقاق 75% على رسم 200 جنيه</span><strong>{{ money(Number(paymentPolicy.customer_service_fee_egp)*Number(paymentPolicy.refund_customer_percent)/100) }}</strong></div><div><span>النسبة المحفوظة في السياسة</span><strong>{{ paymentPolicy.refund_customer_percent }}% / {{ paymentPolicy.refund_support_percent }}%</strong></div></div><button class="primary-button" type="submit">حفظ سياسة الرسوم والاسترداد</button></form><div class="policy-note">السياسة إعداد إداري فقط؛ تحصيل الرسوم والاستردادات ما زال غير مفعّل حتى تهيئة وسيلة الدفع واعتماد الشروط القانونية. مجموع نسب الاسترداد ورسوم الدعم يجب أن يساوي 100%.</div></div>

<script id="samsar-runtime-diagnostic">
(function () {
  function showSamsarRuntimeError(message) {
    var existing = document.getElementById('samsar-runtime-diagnostic-panel');
    if (existing) return;
    var panel = document.createElement('section');
    panel.id = 'samsar-runtime-diagnostic-panel';
    panel.setAttribute('dir', 'rtl');
    panel.style.cssText = 'position:fixed;z-index:999999;inset:16px;overflow:auto;padding:24px;border:2px solid #b45309;border-radius:16px;background:#fffaf0;color:#352b20;font:16px/1.8 Arial,sans-serif;box-shadow:0 12px 40px #0003';
    var title = document.createElement('h2');
    title.textContent = 'تعذّر تشغيل موقع سمسار';
    title.style.cssText = 'margin:0 0 10px;color:#9a3412;font-size:24px';
    var explanation = document.createElement('p');
    explanation.textContent = 'الموقع وصل إلى المتصفح، لكن حدث خطأ أثناء تشغيل JavaScript. احتفظ برسالة الخطأ التالية لإصلاح السبب بدقة:';
    var details = document.createElement('pre');
    details.textContent = String(message || 'خطأ غير محدد').slice(0, 3000);
    details.style.cssText = 'direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:8px;background:#fff;color:#7f1d1d;border:1px solid #fed7aa;font:13px/1.5 monospace';
    var note = document.createElement('p');
    note.textContent = 'هذه رسالة تشخيص مؤقتة؛ لا تُدخل أي كلمات مرور أو بيانات خاصة في هذه الصفحة.';
    panel.appendChild(title);
    panel.appendChild(explanation);
    panel.appendChild(details);
    panel.appendChild(note);
    document.body.appendChild(panel);
  }
  window.addEventListener('error', function (event) {
    var target = event.target;
    if (target && target.tagName === 'SCRIPT') {
      showSamsarRuntimeError('تعذّر تحميل ملف JavaScript: ' + (target.src || 'ملف داخلي'));
      return;
    }
    // Ignore resource-load errors such as images and fonts; they are not JavaScript runtime exceptions.
    if (target && target !== window) return;
    var runtimeError = event.error;
    var detail = event.message || (runtimeError && (runtimeError.stack || runtimeError.message)) || 'JavaScript runtime exception with no message';
    if (event.filename) detail += '\\n' + event.filename + ':' + event.lineno + ':' + event.colno;
    if (runtimeError && runtimeError.name && !detail.includes(runtimeError.name)) detail = runtimeError.name + ': ' + detail;
    showSamsarRuntimeError(detail);
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    showSamsarRuntimeError('Unhandled promise rejection: ' + (reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason)));
  });
  window.setTimeout(function () {
    if (!window.Vue) showSamsarRuntimeError('لم يتم تحميل Vue من CDN. تحقق من اتصال الشبكة أو حظر مكتبة Vue: https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js');
    else {
      var app = document.getElementById('app');
      if (app && !app.children.length && !app.textContent.trim()) showSamsarRuntimeError('تم تحميل Vue، لكن واجهة التطبيق لم تظهر خلال 8 ثوانٍ. افتح Console لمعرفة تفاصيل الخطأ.');
    }
  }, 8000);
})();
</script>

      {id:'assistant',label:'مساعد الموظفين',icon:'✧',roles:['admin']},
      {id:'refunds',label:'الاستردادات',icon:'↻',roles:['admin']},
      {id:'finance',label:'التقارير المالية',icon:'▥',roles:['admin']},
      {id:'payments',label:'الدفع ورسوم الإعلانات',icon:'▣',roles:['admin']},
      {id:'settings',label:'الإعدادات',icon:'⚙',roles:['admin']}
    ]
  };
},

computed:{
  currentYear(){return new Date().getFullYear();},
  today(){
    const d=new Date();
    return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  },
  themeStyle(){
    return {'--primary':this.settings.primaryColor,'--accent':this.settings.accentColor,'--page-bg':this.settings.backgroundColor};
  },
  availableAreas(){
    return [...new Set(this.properties.map(p=>p.neighborhood).filter(Boolean))].sort();
  },
  filteredAdminProperties(){
    const term=(this.adminListingSearch||'').toLocaleLowerCase('ar');
    return this.properties.filter(p=>{
      if(this.sessionUser?.role==='staff'&&p.isDemo)return false;
      const searchable=[p.title,p.area,p.neighborhood,p.listingCode,p.id,p.description].join(' ').toLocaleLowerCase('ar');
      const matches=!term||searchable.includes(term),filter=this.adminListingFilter;
      const kind=filter==='all'||(filter==='demo'&&p.isDemo)||(filter==='real'&&!p.isDemo)||(filter==='published'&&p.backendStatus==='published')||(filter==='sold'&&['rented','مؤجر'].includes(p.backendStatus||p.status));
      return matches&&kind;
    }).sort((a,b)=>Number(b.isDemo)-Number(a.isDemo));
  },
  filteredProperties(){
    const term=(this.filters.query||'').toLocaleLowerCase('ar');
    return this.properties.filter(p=>{
      const text=[p.title,p.area,p.neighborhood,p.type,p.transaction,p.description,p.id].join(' ').toLocaleLowerCase('ar');
      const matches=!term||text.includes(term);
      const transaction=this.filters.transaction==='الكل'||p.transaction===this.filters.transaction;
      const type=this.filters.type==='الكل'||p.type===this.filters.type;
      const area=this.filters.area==='الكل'||p.neighborhood===this.filters.area||p.area===this.filters.area;
      const fav=!this.showFavorites||this.favorites.includes(p.id);
      const maySeeUnpublished=p.isBackendRecord&&(p.ownerId===this.sessionUser?.id||['admin','staff'].includes(this.sessionUser?.role));
      const visibleStatus=p.isBackendRecord?(p.backendStatus==='published'||maySeeUnpublished):p.status!=='موقوف';
      return matches&&transaction&&type&&area&&fav&&visibleStatus;
    }).sort((a,b)=>{
      if(this.filters.sort==='price-asc')return a.price-b.price;
      if(this.filters.sort==='price-desc')return b.price-a.price;
      if(this.filters.sort==='rating')return (b.rating||0)-(a.rating||0);
      return Number(b.featured)-Number(a.featured);
    });
  },
  ownerProperties(){
    return this.sessionUser?.role==='owner'?this.properties.filter(p=>p.ownerEmail===this.sessionUser.email):[];
  },
  ownerViewings(){
    const ids=new Set(this.ownerProperties.map(p=>p.id));
    return this.viewings.filter(v=>ids.has(v.propertyId)).sort((a,b)=>b.createdAt-a.createdAt);
  },
  ownerPendingViewings(){
    return this.ownerViewings.filter(v=>v.status==='بانتظار موافقة المالك');
  },
  customerViewings(){
    return this.sessionUser?this.viewings.filter(v=>v.customerEmail===this.sessionUser.email || v.customerId===this.sessionUser.id).sort((a,b)=>b.createdAt-a.createdAt):[];
  },
  customerViewingsForLookup(){
    const rows=this.customerViewings,term=(this.customerOrderLookup||'').trim().toLowerCase();
    return term?rows.filter(v=>String(v.id||'').toLowerCase().startsWith(term)||String(v.id||'').slice(0,8).toLowerCase()===term):rows;
  },
  customerInquiries(){return this.inquiries.filter(i=>i.customerId===this.sessionUser?.id).sort((a,b)=>b.createdAt-a.createdAt);},
  ownerInquiries(){return this.inquiries.filter(i=>i.ownerId===this.sessionUser?.id).sort((a,b)=>b.createdAt-a.createdAt);},
  staffInquiries(){return this.inquiries.slice().sort((a,b)=>b.createdAt-a.createdAt);},
  realProperties(){return this.properties.filter(p=>p.isBackendRecord&&!p.isDemo);},
  realViewings(){return this.viewings.filter(v=>{const p=this.properties.find(p=>p.id===v.propertyId);return !!p&&p.isBackendRecord&&!p.isDemo;});},
  pendingInquiryCount(){return this.inquiries.filter(i=>['new','waiting_owner','owner_replied'].includes(i.status)).length;},
  inquiryProperty(){return this.properties.find(p=>p.id===this.inquiryPropertyId);},
  viewingProperty(){return this.properties.find(p=>p.id===this.viewingPropertyId);},
  visibleAdminTabs(){
    const role=this.sessionUser?.role;
    return this.adminTabs.filter(t=>{
      if(!t.roles.includes(role))return false;
      if(role==='admin'&&this.adminRouteMode==='admin'&&t.id==='staff')return false;
      if(role==='admin'&&this.adminRouteMode==='settings')return t.id==='settings';
      if(role==='admin'&&this.adminRouteMode==='employees')return t.id==='staff';
      if(role!=='staff')return true;
      const required={listings:'listings_review',viewings:'viewings',inquiries:'inquiries',assistant:'ai_assistant'}[t.id];
      return !required || this.sessionUser?.staffPermissions?.[required]===true;
    });
  },
  favoriteProperties(){return this.properties.filter(p=>this.favorites.includes(p.id));},
  myNotifications(){
    if(!this.sessionUser)return [];
    if(this.sessionUser.role==='customer')return this.customerViewings.map(v=>({id:v.id,title:v.status,description:(this.properties.find(p=>p.id===v.propertyId)?.title||'عقار')+' · '+v.date,requestId:v.id}));
    if(this.sessionUser.role==='owner')return this.ownerViewings.map(v=>({id:v.id,title:'طلب معاينة',description:(this.properties.find(p=>p.id===v.propertyId)?.title||'عقار')+' · '+v.status,requestId:v.id}));
    return this.viewings.slice(0,5).map(v=>({id:v.id,title:v.status,description:(this.properties.find(p=>p.id===v.propertyId)?.title||'عقار')+' · '+v.date,requestId:v.id}));
  },
  ratingCount(){return this.properties.reduce((sum,p)=>sum+(Number(p.reviews)||0),0);},
  averageRating(){
    const count=this.ratingCount;
    return count?this.properties.reduce((sum,p)=>sum+(Number(p.rating)||0)*(Number(p.reviews)||0),0)/count:0;
  },
  ratingDistribution(){
    return [5,4,3,2,1].map(stars=>{
      const count=this.properties.reduce((sum,p)=>sum+(Math.round(Number(p.rating)||0)===stars?(Number(p.reviews)||0):0),0);
      return {stars,count,percent:this.ratingCount?Math.round(count/this.ratingCount*100):0};
    });
  },
  listingStatusSummary(){
    const items=[{label:'مسودة',key:'مسودة'},{label:'قيد المراجعة',key:'قيد المراجعة'},{label:'منشور',key:'منشور'},{label:'مرفوض',key:'مرفوض'},{label:'مؤجر',key:'مؤجر'},{label:'مؤرشف',key:'مؤرشف'}];
    const list=this.properties.filter(p=>!p.isDemo&&p.isBackendRecord&&(this.listingChartFilter==='all'||p.transaction===this.listingChartFilter));
    const total=Math.max(list.length,1);
    return items.map(i=>{
      const count=list.filter(p=>(p.status||'مسودة')===i.key).length;
      return {...i,count,percent:Math.round(count/total*100)};
    });
  },
  recentViewings(){return [...this.viewings].sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);},
  staffDashboardMetrics(){
    const inquiries=this.inquiries.filter(item=>!item.isDemo);
    const viewings=this.realViewings;
    const pendingInquiries=inquiries.filter(item=>['new','waiting_owner','owner_replied'].includes(item.status));
    const openViewings=viewings.filter(item=>!['ملغاة من العميل','مرفوضة من المالك','اكتملت المعاينة','completed','cancelled','rejected'].includes(item.status));
    const closedInquiries=inquiries.filter(item=>['answered','closed','تم الرد على العميل','مغلق'].includes(item.status)).length;
    const completedViewings=viewings.filter(item=>['اكتملت المعاينة','completed'].includes(item.status)).length;
    const activeCutoff=Date.now()-7*24*60*60*1000;
    const activeIds=new Set();
    inquiries.filter(item=>item.createdAt>=activeCutoff&&item.customerId).forEach(item=>activeIds.add(item.customerId));
    viewings.filter(item=>item.createdAt>=activeCutoff&&item.customerId).forEach(item=>activeIds.add(item.customerId));
    const rated=this.realProperties.filter(item=>Number(item.rating)>0&&Number(item.reviews)>0);
    const propertyRatingCount=rated.reduce((sum,item)=>sum+(Number(item.reviews)||0),0);
    const averagePropertyRating=propertyRatingCount?rated.reduce((sum,item)=>sum+(Number(item.rating)||0)*(Number(item.reviews)||0),0)/propertyRatingCount:0;
    return {pendingInquiries:pendingInquiries.length,openViewings:openViewings.length,activeCustomers:activeIds.size,publishedProperties:this.realProperties.filter(item=>['منشور','published'].includes(item.status)||item.backendStatus==='published').length,closedInquiries,completedViewings,inquiryCompletion:inquiries.length?Math.round(closedInquiries/inquiries.length*100):0,viewingCompletion:viewings.length?Math.round(completedViewings/viewings.length*100):0,averagePropertyRating,propertyRatingCount};
  },
  staffWeeklyTrend(){
    const days=[];
    const now=new Date();
    const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6);
    for(let offset=0;offset<7;offset++){
      const date=new Date(start.getFullYear(),start.getMonth(),start.getDate()+offset);
      const key=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
      const inRange=timestamp=>{const d=new Date(timestamp);return !Number.isNaN(d.getTime())&&d.getFullYear()===date.getFullYear()&&d.getMonth()===date.getMonth()&&d.getDate()===date.getDate();};
      days.push({key,label:date.toLocaleDateString('ar-EG',{weekday:'short'}),inquiries:this.inquiries.filter(item=>!item.isDemo&&inRange(item.createdAt)).length,viewings:this.realViewings.filter(item=>inRange(item.createdAt)).length});
    }
    return days;
  },
  staffWeeklyTrendMax(){return Math.max(1,...this.staffWeeklyTrend.flatMap(day=>[day.inquiries,day.viewings]));},
  staffChartHeight(value,max){return value?Math.max(8,Math.round(Number(value)/Math.max(1,max)*100)):3;},
  staffRecentActivity(){
    const inquiries=this.inquiries.filter(item=>!item.isDemo).map(item=>({id:'inquiry-'+item.id,kind:'inquiry',title:item.propertyTitle||'استفسار عقاري',subtitle:'استفسار عميل',when:item.createdAt?new Date(item.createdAt).toLocaleString('ar-EG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'تاريخ غير متاح',status:item.statusLabel||item.status,done:['answered','closed'].includes(item.status),createdAt:Number(item.createdAt)||0}));
    const viewings=this.realViewings.map(item=>({id:'viewing-'+item.id,kind:'viewing',title:this.properties.find(p=>p.id===item.propertyId)?.title||'طلب معاينة',subtitle:item.customerName||'عميل',when:item.createdAt?new Date(item.createdAt).toLocaleString('ar-EG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'تاريخ غير متاح',status:item.status,done:['اكتملت المعاينة','تمت الموافقة من المالك'].includes(item.status),createdAt:Number(item.createdAt)||0}));
    return [...inquiries,...viewings].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  }
},

created(){this.loadDemoData();this.initializeBackend();},

beforeUnmount(){if(this.toastTimer)clearTimeout(this.toastTimer);},

methods:{
  emptyListingForm(){
    return {title:'',transaction:'إيجار',type:'شقة',price:'',suggestedPrice:'',area:'',neighborhood:'',addressText:'',size:'',bedrooms:2,bathrooms:1,description:'',amenitiesText:'',contractDetails:'',mapUrl:'',previewImages:[],identityDocName:'',ownershipDocName:'',isDemo:false};
  },
  emptyViewingForm(){return {customerName:'',phone:'',date:'',time:'16:00',note:''};},
  money(value){
    return new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:0}).format(Number(value)||0);
  },
  isNewProfile(profile){
    if(!profile?.created_at)return false;
    const created=new Date(profile.created_at).getTime();
    return Number.isFinite(created)&&created>=Date.now()-7*24*60*60*1000;
  },
  starsText(value){
    const n=Math.max(0,Math.min(5,Math.round(Number(value)||0)));
    return '★'.repeat(n)+'☆'.repeat(5-n);
  },
  toast(message){
    this.toastMessage=message;
    if(this.toastTimer)clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>this.toastMessage='',3200);
  },
  scrollTo(id){
    this.$nextTick(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}));
  },
  resetFilters(){this.filters={query:'',transaction:'الكل',type:'الكل',area:'الكل',sort:'featured'};this.showFavorites=false;},
  isValidUrl(value){
    try{const u=new URL(value);return u.protocol==='https:'||u.protocol==='http:';}catch{return false;}
  },
  onImageError(event){
    if(event.target&&!event.target.dataset.fallbackApplied){
      event.target.dataset.fallbackApplied='true';
      event.target.src=this.fallbackImage;
    }
  },
  loadDemoData(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw)return;
      const saved=JSON.parse(raw);
      if(Array.isArray(saved.properties))this.properties=saved.properties.map(p=>({...p,isDemo:!p.isBackendRecord,photos:Array.isArray(p.photos)&&p.photos.length?p.photos.map(photo=>typeof photo==='string'?{key:makeId('photo'),src:photo}:photo):[{key:makeId('photo'),src:this.fallbackImage}],amenities:Array.isArray(p.amenities)?p.amenities:[]}));
      if(Array.isArray(saved.viewings))this.viewings=saved.viewings;
      if(Array.isArray(saved.favorites))this.favorites=saved.favorites;
      if(saved.userRatings)this.userRatings=saved.userRatings;
      if(saved.settings)this.settings={...defaultSettings(),...saved.settings};
    }catch(error){console.warn('تعذر تحميل البيانات التجريبية:',error);}
  },
  persistDemo(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({properties:this.properties,viewings:this.viewings,favorites:this.favorites,userRatings:this.userRatings,settings:this.settings}));
    }catch(error){
      console.warn('تعذر حفظ البيانات محليًا:',error);
      this.toast('مساحة التخزين في المتصفح ممتلئة. قلل عدد الصور.');
    }
  },
  async initializeBackend(){
    if(!supabaseClient){this.backendAvailable=false;this.backendError='تعذر تحميل مكتبة الاتصال؛ جرّب تحديث الصفحة.';return;}
    this.backendAvailable=true;
    try{
      const {data:{session},error}=await supabaseClient.auth.getSession();
      if(error)throw error;
      if(session)await this.syncAuthSession(session);
      await this.loadBackendProperties();
      await this.loadPublicSettings();
      await this.loadBackendViewings();
      await this.loadBackendInquiries();
      await this.loadAIHistory();
      await this.loadBackendProfiles();
      if(this.sessionUser?.role==='admin')await this.loadPaymentAdminData();
      await this.loadAvailablePaymentMethods();
      const {data:{subscription}}=supabaseClient.auth.onAuthStateChange((_event,session)=>{
        setTimeout(async()=>{
          try{
            await this.syncAuthSession(session);
            await this.loadBackendProperties();
            await this.loadPublicSettings();
            await this.loadBackendViewings();
            await this.loadBackendInquiries();
            await this.loadAIHistory();
            await this.loadBackendProfiles();
            if(this.sessionUser?.role==='admin')await this.loadPaymentAdminData();
            await this.loadAvailablePaymentMethods();
            if(this.pendingInquiryPropertyId && this.sessionUser?.role==='customer'){
              const pendingId=this.pendingInquiryPropertyId;this.pendingInquiryPropertyId='';
              const pendingProperty=this.getProperty(pendingId);
              if(pendingProperty&&!pendingProperty.isDemo){this.inquiryPropertyId=pendingId;this.inquiryQuestion='';this.inquiryOpen=true;this.selectedProperty=null;}
            }
            this.handleDashboardDeepLink();
          }
          catch(error){console.error('Samsar auth refresh failed:',error);this.backendError='تعذر تحديث بيانات الحساب من قاعدة البيانات.';}
        },0);
      });
      this.authSubscription=subscription;this.backendReady=true;this.backendError='';
      this.handleDashboardDeepLink();
    }catch(error){console.error('Samsar backend initialization failed:',error);this.backendError='تعذر الاتصال بقاعدة البيانات حاليًا؛ البيانات الظاهرة قد تكون تجريبية.';}
  },
  handleDashboardDeepLink(){
    const params=new URLSearchParams(window.location.search);
    const route=params.has('admin')?'admin':(params.has('employees')?'employees':(params.has('staff')?'staff':(params.has('settings')?'settings':(params.has('owner')?'owner':(params.has('customer')?'customer':(params.has('dashboard')?'dashboard':''))))));
    if(!route)return;
    this.adminRouteMode=route;
    if(!this.sessionUser){this.openLogin();return;}
    if(route==='admin'&&this.sessionUser.role!=='admin'){this.adminOpen=false;this.loginOpen=true;this.loginError='هذا الرابط مخصص لمدير النظام فقط. سجّل الدخول بحساب الأدمن المعتمد.';this.toast('هذه مساحة خاصة بالأدمن.');return;}
    if((route==='settings'||route==='employees')&&this.sessionUser.role!=='admin'){this.adminOpen=false;this.loginOpen=true;this.loginError='هذه الصفحة مخصصة لمدير النظام فقط.';this.toast('لا تملك صلاحية الدخول لهذه الصفحة.');return;}
    if(route==='staff'&&this.sessionUser.role!=='staff'){this.adminOpen=false;this.loginOpen=true;this.loginError='هذه مساحة الموظفين المعتمدين فقط. استخدم حساب الموظف الصحيح.';this.toast('لا تملك صلاحية الدخول لمساحة الموظفين.');return;}
    if(route==='dashboard'&&!['admin','staff'].includes(this.sessionUser.role)){this.adminOpen=false;this.toast('لوحة العمل متاحة للمدير والموظف المعتمد فقط.');return;}
    if(route==='owner'&&this.sessionUser.role!=='owner'){this.toast('هذه الصفحة مخصصة لصاحب العقار.');return;}
    if(route==='customer'&&this.sessionUser.role!=='customer'){this.toast('هذه الصفحة مخصصة لحساب العميل.');return;}
    if(route==='owner'){this.adminOpen=false;this.$nextTick(()=>this.scrollTo('owner-workspace'));return;}
    if(route==='customer'){this.adminOpen=false;this.$nextTick(()=>this.scrollTo('my-viewings'));return;}
    this.adminRouteMode=route;this.adminOpen=true;this.adminTab=route==='settings'?'settings':(route==='employees'?'staff':'overview');
  },
  async syncAuthSession(session){
    if(!session?.user){if(this.sessionUser?.isSupabaseUser)this.sessionUser=null;return;}
    const user=session.user;let profile=null;const metadata=user.user_metadata||{};
    try{const {data,error}=await supabaseClient.from('profiles').select('full_name,phone,whatsapp_phone,address_text,requested_role,role,staff_permissions').eq('id',user.id).maybeSingle();if(error)throw error;profile=data;
      const patch={};if(metadata.address_text&&!profile?.address_text)patch.address_text=metadata.address_text;if(metadata.requested_role==='owner'&&profile?.requested_role!=='owner')patch.requested_role='owner';
      if(Object.keys(patch).length&&profile){const {error:updateError}=await supabaseClient.from('profiles').update(patch).eq('id',user.id);if(updateError)console.warn('Profile contact details could not be synced:',updateError);else profile={...profile,...patch};}
    }catch(error){console.error('Could not load Samsar profile:',error);}
    this.sessionUser={id:user.id,email:user.email||'',name:profile?.full_name||metadata.full_name||user.email||'مستخدم سمسار',phone:profile?.phone||user.phone||'',address:profile?.address_text||metadata.address_text||'',role:profile?.role||'customer',staffPermissions:profile?.staff_permissions||{},isSupabaseUser:true};
  },
  async loadBackendProperties(){
    if(!supabaseClient)return;
    const selection=this.sessionUser?.isSupabaseUser
      ? '*, property_images(*), property_amenities(*), owner:profiles!properties_owner_id_fkey(full_name)'
      : '*, property_images(*), property_amenities(*)';
    const {data,error}=await supabaseClient.from('properties').select(selection).order('created_at',{ascending:false});
    if(error)throw error;
    const rows=Array.isArray(data)?data:[];
    if(rows.length){this.properties=rows.map(row=>this.mapBackendProperty(row));this.dataMode='live';}
    else{this.properties=defaultProperties().map(p=>({...p,isDemo:true}));this.dataMode='demo';}
    this.backendError='';
  },
  mapBackendProperty(row){
    const typeNames={apartment:'شقة',villa:'فيلا',studio:'استوديو',room:'غرفة',duplex:'دوبلكس',penthouse:'بنتهاوس',chalet:'شاليه',commercial:'محل تجاري',other:'أخرى'};
    const statusNames={draft:'مسودة',pending_review:'قيد المراجعة',published:'منشور',rejected:'مرفوض',rented:'مؤجر',archived:'مؤرشف'};
    const images=(row.property_images||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(item=>{
      const source=String(item.storage_path||'');
      const src=/^https?:\/\//i.test(source)?source:supabaseClient.storage.from('property-images').getPublicUrl(source).data.publicUrl;
      return {key:item.id,src,storagePath:source,altText:item.alt_text||'',isCover:!!item.is_cover};
    });
    const amenities=(row.property_amenities||[]).map(item=>item.amenity_name).filter(Boolean);
    return {id:row.id,listingCode:row.listing_code,isBackendRecord:true,isDemo:!!row.is_demo,ownerId:row.owner_id,ownerFeeStatus:row.owner_fee_status,
      title:sanitizePublicPropertyText(row.title),description:sanitizePublicPropertyText(row.description||''),transaction:row.listing_type==='rent'?'إيجار':'بيع',type:typeNames[row.property_type]||'أخرى',
      price:Number(row.listing_type==='rent'?row.monthly_rent_egp:row.sale_price_egp)||0,suggestedPrice:Number(row.suggested_price_egp)||0,

  rateProperty(property,stars){
    if(property?.isBackendRecord){this.toast('حفظ التقييمات في قاعدة البيانات سيتم تفعيله في مرحلة مستقلة.');return;}
    if(!this.sessionUser){this.toast('سجّل الدخول بحساب العميل لإضافة تقييم تجريبي.');return;}
    if(this.sessionUser.role!=='customer'){this.toast('التقييم متاح لحساب العميل في هذه المعاينة.');return;}
    if(this.userRatings[property.id]){this.toast('تم تسجيل تقييمك لهذا العقار بالفعل.');return;}
    const oldCount=Number(property.reviews)||0;
    const oldRating=Number(property.rating)||0;
    property.rating=Number(((oldRating*oldCount+stars)/(oldCount+1)).toFixed(1));
    property.reviews=oldCount+1;
    this.userRatings[property.id]=stars;
    this.persistDemo();
    this.toast('تم حفظ تقييمك محليًا.');

      }else{

        await this.syncAuthSession(data.session);await this.loadBackendProperties();await this.loadBackendViewings();await this.loadBackendProfiles();this.loginOpen=false;this.handleDashboardDeepLink();this.toast('تم تسجيل الدخول بنجاح.');

  compressImage(file){
    return new Promise((resolve,reject)=>{
      const image=new Image();
      const url=URL.createObjectURL(file);
      image.onload=()=>{
        try{
          const max=1280;
          const scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
          const canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
          canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
          const ctx=canvas.getContext('2d');
          if(!ctx)throw new Error('Canvas is unavailable');
          ctx.drawImage(image,0,0,canvas.width,canvas.height);
          const src=canvas.toDataURL('image/jpeg',0.68);
          URL.revokeObjectURL(url);
          resolve(src);
        }catch(error){URL.revokeObjectURL(url);reject(error);}
      };
      image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('تعذر قراءة الصورة'));};
      image.src=url;
    });
  },
  async onListingImages(event){

    if(chosen.length<files.length)this.toast('يمكن إضافة 10 صور فقط، والملفات لازم تكون صورًا.');
    for(const file of chosen){
      if(file.size>15*1024*1024){this.toast('تم تجاهل صورة أكبر من 15 ميجابايت.');continue;}
