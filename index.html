<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0F766E" />
<meta name="description" content="سمسار SAMSAR — اكتشف العقارات المناسبة لك في مصر، واستكشف إعلانات البيع والإيجار، وتعرّف على التفاصيل واطلب معاينة عقارك بسهولة." />
<title>سمسار SAMSAR | اكتشف عقارك المناسب</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>

:root{color-scheme:light;font-family:'Cairo',sans-serif;background:#faf7ef}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#faf7ef}
body{margin:0;min-width:320px;font-family:'Cairo',sans-serif;background:#faf7ef;color:#173f3e}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #12a69a55;outline-offset:2px}

.samsar{--primary:#075c59;--accent:#12a69a;--page-bg:#faf7ef;min-height:100vh;background:var(--page-bg);color:#173f3e;font-family:'Cairo',sans-serif;overflow-wrap:anywhere}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:70px;padding:10px 4%;border-bottom:1px solid #e5e6da;background:#fffffff2;backdrop-filter:blur(15px)}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;color:#fff;background:linear-gradient(145deg,var(--accent),var(--primary));font-size:29px;font-weight:900;box-shadow:0 6px 15px #075c5925}
.brand strong,.brand small{display:block}
.brand strong{font-size:21px;font-weight:900;color:var(--primary)}
.brand small{font-size:9px;color:#80968d}
.nav-links{display:flex;align-items:center;gap:22px}
.nav-links a{font-size:11px;font-weight:800;color:#45685f}
.nav-links a:hover{color:var(--accent)}
.top-actions{display:flex;align-items:center;gap:7px}
.icon-button{position:relative;display:grid;place-items:center;min-width:32px;height:34px;border:0;border-radius:8px;color:#466c61;background:transparent;font-size:19px}
.icon-button:hover{background:#eaf4eb}
.icon-button sup{position:absolute;top:-3px;left:-2px;display:grid;place-items:center;min-width:14px;height:14px;padding:0 3px;border-radius:20px;color:white;background:#d98942;font-size:8px}
.login-button,.primary-button,.search-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 17px;border:1px solid var(--primary);border-radius:9px;color:white;background:var(--primary);font-size:11px;font-weight:900;transition:.2s}
.primary-button:hover,.login-button:hover,.search-button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.small-button,.outline-light-button,.details-button,.danger-button,.outline-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:35px;padding:7px 11px;border:1px solid #cfe1d6;border-radius:8px;color:var(--primary);background:#fff;font-size:10px;font-weight:800}
.outline-button{min-height:42px;padding:10px 15px;border-color:#ffffff99;color:#fff;background:#ffffff14}
.danger-button{border-color:#f0d8d5;color:#aa4b43;background:#fff7f5}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.notification-popover{position:absolute;top:65px;left:5%;z-index:30;width:310px;max-width:90vw;padding:15px;border:1px solid #e0e8df;border-radius:12px;background:#fff;box-shadow:0 15px 35px #173d3024}
.notification-heading{display:flex;align-items:center;justify-content:space-between}
.notification-item{display:block;width:100%;padding:10px 0;border:0;border-bottom:1px solid #edf1eb;text-align:right;background:white}
.notification-item strong,.notification-item small{display:block}
.notification-item strong{color:var(--primary);font-size:11px}
.notification-item small{margin-top:4px;color:#89968c;font-size:9px}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;min-height:560px;padding:60px 7% 145px;gap:25px;overflow:hidden;background:#eee7d6}
.hero-bg{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=88');background-position:center;background-size:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(270deg,#faf7eff5 0%,#faf7efe0 42%,#faf7ef08 100%)}
.hero-copy{position:relative;z-index:1;max-width:600px}
.eyebrow{display:inline-block;color:var(--accent);font-size:11px;font-weight:900}
.hero h1{margin:16px 0;font-size:clamp(34px,4.7vw,58px);line-height:1.48;font-weight:900;color:#104e4a}
.hero h1 em{color:#11988e;font-style:normal}
.hero-copy>p{max-width:540px;color:#54736a;font-size:13px;line-height:2.1}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:23px}
.hero .primary-button{color:white}
.hero .outline-button{color:var(--primary);border-color:#b9d5ca;background:#ffffffe5}
.hero-points{display:flex;flex-wrap:wrap;gap:14px;margin-top:25px;color:#55746a;font-size:9px}
.hero-illustration{position:relative;z-index:1;display:grid;place-items:center;min-height:340px}
.hero-circle{position:absolute;width:min(330px,90%);aspect-ratio:1;border:1px solid #0a62552b;border-radius:50%;box-shadow:0 0 0 25px #0a625509,0 0 0 50px #0a625506}
.hero-house{position:relative;z-index:2;width:205px;filter:drop-shadow(0 16px 20px #12392c30)}
.house-roof{width:0;height:0;margin-right:-11px;border-right:116px solid transparent;border-left:116px solid transparent;border-bottom:58px solid #decba6}
.house-body{position:relative;display:flex;flex-direction:column;gap:13px;min-height:190px;padding:20px 16px 0;border:5px solid #d4bd97;border-bottom:0;background:linear-gradient(135deg,#fff7e7,#d4c09f)}
.house-windows{display:flex;justify-content:space-around;gap:15px}
.house-windows i{width:48px;height:38px;border:4px solid #fff6e3;background:linear-gradient(135deg,#89c8c0,#22685f)}
.house-balcony{height:7px;background:#a68757;box-shadow:0 5px #c6ac7f}
.house-door{position:absolute;right:50%;bottom:0;width:36px;height:46px;transform:translateX(50%);border:4px solid #f0dec0;border-bottom:0;border-radius:13px 13px 0 0;background:#205e57}
.floating-info{position:absolute;z-index:4;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #fff;border-radius:12px;background:#fffffff0;box-shadow:0 10px 25px #0b56401b}
.floating-info>span{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--primary);background:#e6f4e9;font-size:21px}
.floating-info strong,.floating-info small{display:block}
.floating-info strong{font-size:10px}
.floating-info small{margin-top:4px;color:#84988e;font-size:8px}
.info-one{top:45px;right:-5px}.info-two{bottom:27px;left:-6px}
.hero-search{position:absolute;z-index:5;right:7%;bottom:26px;left:7%;display:grid;grid-template-columns:1.3fr .8fr .8fr .8fr auto;align-items:end;gap:10px;padding:14px;border:1px solid #e5e4d8;border-radius:15px;background:#fffffff5;box-shadow:0 12px 35px #244c3b1a}
.hero-search label,.login-form label,.form-grid label,.admin-form label{display:flex;flex-direction:column;gap:7px;color:#668078;font-size:10px;font-weight:800}
.hero-search input,.hero-search select,.login-form input,.form-grid input,.form-grid select,.form-grid textarea,.wide-label input,.wide-label textarea,.admin-form input,.admin-form textarea,.admin-form select,.sort-label select{width:100%;min-height:39px;padding:8px 10px;border:1px solid #e2e8df;border-radius:8px;outline:none;color:#254d45;background:#fcfdf9;font-size:10px}
.hero-search input:focus,.hero-search select:focus,.login-form input:focus,.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus,.wide-label input:focus,.wide-label textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #12a69a16}
.hero-search .search-button{min-height:39px}
.features-band{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:21px 6%;border-bottom:1px solid #e8eadf;background:#fffdf7}
.features-band>div{display:grid;grid-template-columns:35px 1fr;align-items:center;gap:4px 10px;padding:5px 14px}
.features-band>div+div{border-right:1px solid #e8e9df}
.features-band>div>span{grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border:1px solid #cfe5d7;border-radius:10px;color:var(--primary);background:#edf7ed;font-size:20px}
.features-band strong{color:#185e54;font-size:11px}
.features-band small{color:#8b9a91;font-size:9px}
.section{padding:60px 6%}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:24px}
.section-heading h2{margin:7px 0;color:var(--primary);font-size:clamp(24px,3vw,35px);font-weight:900}
.section-heading p{margin:0;color:#82938a;font-size:11px;line-height:1.9}
.centered{justify-content:center;text-align:center}
.demo-badge{padding:6px 10px;border:1px solid #d5e8d8;border-radius:7px;color:#477c61;background:#edf7ec;font-size:9px;font-weight:800}
.property-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.filter-chips{display:flex;gap:6px}
.filter-chips button{min-height:31px;padding:6px 13px;border:1px solid #dce6db;border-radius:7px;color:#648176;background:#fff;font-size:10px}
.filter-chips button.active{color:#fff;border-color:var(--primary);background:var(--primary)}
.sort-label{display:flex;align-items:center;gap:8px;color:#81938a;font-size:10px}
.sort-label select{width:auto;min-height:33px}
.results-count{color:#668078;font-size:11px}
.property-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.property-card{min-width:0;overflow:hidden;border:1px solid #e7e8dc;border-radius:12px;background:#fff;box-shadow:0 4px 14px #263e2b08;transition:transform .2s,box-shadow .2s}
.property-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #193d2b14}
.property-photo{position:relative;height:185px;overflow:hidden;cursor:pointer;background:#e2ece4}
.property-photo>img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.property-card:hover .property-photo>img{transform:scale(1.035)}
.property-badge,.featured-badge,.photo-count{position:absolute;z-index:2;padding:5px 8px;border-radius:6px;font-size:9px;font-weight:900}
.property-badge{top:10px;right:10px;color:#14665b;background:#e7f8ed}
.sale-badge{color:#8d5b26;background:#fff0d2}
.featured-badge{top:10px;left:10px;color:#8d6a2c;background:#fff3d4}
.photo-count{right:9px;bottom:9px;color:white;background:#143f3acb}
.favorite-button{position:absolute;top:9px;left:9px;z-index:3;display:grid;place-items:center;width:30px;height:30px;border:1px solid #ffffffa6;border-radius:50%;color:#fff;background:#173f3e8a;font-size:18px}
.favorite-button.favorited{color:#e74e61;background:#fff}
.property-content{padding:13px}
.property-location{color:#82968b;font-size:9px}
.property-title{display:block;width:100%;margin:7px 0;padding:0;border:0;color:#184f47;background:transparent;text-align:right;font-size:13px;font-weight:900;line-height:1.8}
.property-card-rating,.rating-inline{display:flex;align-items:center;gap:5px;margin:4px 0 10px}
.stars{color:#ed9e2a;letter-spacing:0;font-size:11px;white-space:nowrap}
.rating-inline strong,.property-card-rating strong{color:#345e51;font-size:10px}
.rating-inline small,.property-card-rating small{color:#99a39b;font-size:8px}
.property-specs{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;padding:10px 0;border-top:1px solid #eef0e8;border-bottom:1px solid #eef0e8;color:#7c8f84;font-size:9px}
.property-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:11px}
.property-price{display:block;color:var(--primary);font-size:14px;font-weight:900}
.property-bottom small{display:block;margin-top:3px;color:#8d9b92;font-size:8px}
.details-button{min-height:31px;padding:6px 9px;background:#f1f8f0}
.empty-state{padding:32px 15px;border:1px dashed #d3e1d3;border-radius:11px;color:#83948a;background:#ffffffad;text-align:center;font-size:11px;line-height:1.9}
.empty-symbol{font-size:32px;color:var(--accent)}
.empty-state h3{color:var(--primary)}
.how-section{padding:65px 7%;background:#fff}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step-card{position:relative;padding:23px;border:1px solid #e6ece3;border-radius:12px;background:linear-gradient(145deg,#fff,#f7faf4)}
.step-no{position:absolute;top:14px;left:17px;color:#d7e9de;font-size:24px;font-weight:900}
.step-icon{display:grid;place-items:center;width:46px;height:46px;border:1px solid #d6e9dc;border-radius:12px;color:var(--primary);background:#eaf5eb;font-size:23px}
.step-card h3{color:var(--primary);font-size:15px}
.step-card p{color:#82938a;font-size:10px;line-height:2}
.tinted-section{background:#f1f6ef}
.owner-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:23px}
.owner-stats>div{padding:17px;border:1px solid #e1e8dc;border-radius:9px;background:white}
.owner-stats small,.owner-stats strong{display:block}
.owner-stats small{color:#89988e;font-size:10px}
.owner-stats strong{margin-top:6px;color:var(--primary);font-size:25px}
.form-panel{margin:22px 0;padding:20px;border:1px solid #dfe9dc;border-radius:12px;background:white}
.form-panel h3,.subheading{color:var(--primary);font-size:17px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:15px 0}
.form-grid textarea,.wide-label textarea{resize:vertical;line-height:1.8}
.wide-label{display:flex;flex-direction:column;gap:7px;margin:13px 0;color:#668078;font-size:10px;font-weight:800}
.upload-panel{margin:16px 0;padding:15px;border:1px dashed #c8dfcf;border-radius:10px;background:#f8fbf5}
.upload-panel strong{color:var(--primary);font-size:12px}
.upload-trigger{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border:1px solid #cfe4d4;border-radius:8px;color:var(--primary);background:#fff;font-size:10px;font-weight:900;cursor:pointer}
.upload-trigger span{font-size:19px}
.upload-trigger input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.upload-count{display:inline-block;margin-right:10px;color:#71877a;font-size:10px}
.upload-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:13px}
.upload-thumb{position:relative;height:105px;overflow:hidden;border:1px solid #e1e8dc;border-radius:8px;background:#e9f0e7}
.upload-thumb img{width:100%;height:100%;object-fit:cover}
.upload-thumb>button{position:absolute;top:5px;left:5px;width:22px;height:22px;border:0;border-radius:50%;color:white;background:#9e3d38d9;font-size:10px}
.main-photo-tag{position:absolute;right:4px;bottom:4px;padding:4px 5px;border-radius:4px;color:white;background:#075c59d9;font-size:7px}
.hint,.muted{color:#87978d;font-size:9px;line-height:1.9}
.policy-note{margin:14px 0;padding:12px;border-right:3px solid #8cb89b;border-radius:6px;color:#688073;background:#eef6eb;font-size:10px;line-height:1.9}
.inline-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}
.owner-list-grid,.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.owner-card{display:flex;gap:12px;padding:11px;border:1px solid #e1e8dc;border-radius:10px;background:white}
.owner-card>img{width:120px;min-height:130px;flex-shrink:0;border-radius:7px;object-fit:cover}
.owner-card h4{color:var(--primary);font-size:12px}
.owner-card p{color:#87968d;font-size:9px}
.owner-card-content>strong{color:var(--primary);font-size:12px}
.record-card{padding:15px;border:1px solid #e1e9df;border-radius:10px;background:white}
.record-card p{color:#7f9086;font-size:10px;line-height:1.8}
.status-pill{display:inline-flex;padding:5px 8px;border:1px solid #deeadc;border-radius:20px;color:#5f8272;background:#f4f9f1;font-size:9px}
.danger-button{min-height:32px}
.about-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:32px 7%;background:#eaf3e7}
.about-strip h2{margin:8px 0;color:var(--primary);font-size:23px}
.about-strip p{color:#7b9084;font-size:11px;line-height:2}
.footer{padding:30px 6% 18px;border-top:1px solid #e4e9db;background:white}
.footer-main{display:flex;align-items:center;justify-content:space-between;gap:20px}
.footer-main>p{max-width:440px;color:#8a9990;font-size:10px;line-height:2}
.footer-links{display:flex;flex-wrap:wrap;gap:18px;padding:18px 0;border-bottom:1px solid #eef0e9;color:#678075;font-size:10px}
.footer-links button,.text-button,.discreet-button{padding:0;border:0;color:inherit;background:transparent;font-size:inherit}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:15px;color:#96a199;font-size:9px}

.overlay{position:fixed;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;padding:15px;background:#18392f9c;backdrop-filter:blur(5px)}
.modal{width:min(650px,100%);max-height:94vh;overflow:auto;padding:22px;border:1px solid #e0e8dc;border-radius:14px;background:#fff;box-shadow:0 25px 80px #143e2c35}
.modal-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-heading h2{margin:5px 0;color:var(--primary);font-size:22px}
.modal-heading p{color:#829187;font-size:10px}
.close-button{display:grid;place-items:center;width:34px;height:34px;border:1px solid #e1e8dd;border-radius:8px;color:#5e786a;background:white}
.detail-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.detail-gallery img{width:100%;height:170px;border-radius:8px;object-fit:cover}
.detail-gallery img:first-child:nth-last-child(1){grid-column:1/-1;height:245px}
.detail-price{display:flex;align-items:baseline;gap:12px;margin:17px 0}
.detail-price strong{color:var(--primary);font-size:24px}
.detail-price small{color:#83948a;font-size:10px}
.detail-specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}
.detail-specs>div{padding:12px 8px;border:1px solid #e4ebdf;border-radius:8px;background:#f8faf5}
.detail-specs span,.detail-specs strong{display:block}
.detail-specs span{color:#87968d;font-size:9px}
.detail-specs strong{margin-top:5px;color:var(--primary);font-size:12px}
.property-modal h3{margin:19px 0 8px;color:var(--primary);font-size:13px}
.detail-description{color:#778a7e;font-size:11px;line-height:2}
.amenities{display:flex;gap:7px;flex-wrap:wrap}
.amenities span{padding:7px 9px;border-radius:6px;color:#467863;background:#edf6e9;font-size:9px}
.map-link{display:inline-block;margin-top:13px;color:var(--primary);font-size:10px;font-weight:900}
.rating-box{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:20px;padding:15px;border:1px solid #e2e9dc;border-radius:10px;background:#f9fbf5}
.rating-box>div:first-child strong,.rating-box>div:first-child small{display:block}
.rating-box>div:first-child strong{color:var(--primary);font-size:11px}
.rating-box>div:first-child small{margin-top:4px;color:#87968d;font-size:9px}
.rating-buttons{display:flex;align-items:center;gap:3px}
.rating-buttons button{padding:3px;border:0;color:#bfc7bd;background:transparent;font-size:23px}
.rating-buttons button.selected{color:#f0a42f}
.rating-summary{grid-column:1/-1;display:flex;align-items:center;gap:7px}
.rating-summary strong{color:var(--primary);font-size:12px}
.rating-summary small{color:#89978d;font-size:9px}
.detail-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid #e8eee4}
.detail-footer small,.detail-footer strong{display:block}
.detail-footer small{color:#87968d;font-size:9px}
.detail-footer strong{margin-top:5px;color:var(--primary);font-size:11px}
.login-modal{width:min(480px,100%)}
.login-form{display:grid;gap:13px}
.login-form .form-grid{margin:0}
.full-width{width:100%;margin-top:8px}
.error-message{color:#b4453b;font-size:10px}
.demo-accounts{margin-top:18px;padding:13px;border:1px solid #e0e9df;border-radius:9px;background:#f8fbf6}
.demo-accounts>strong{display:block;margin-bottom:9px;color:var(--primary);font-size:11px}

<body>
<noscript><strong>هذا الموقع يحتاج إلى تفعيل JavaScript لكي يعمل بشكل صحيح.</strong></noscript>
<div id="app"></div>

<script type="text/x-template" id="samsar-tpl">
<div class="samsar" dir="rtl" :style="themeStyle">
  <!-- الشريط العلوي -->
  <header class="topbar">
    <a href="#home" class="brand">
      <span class="brand-mark">⌂</span>
      <span><strong>{{ settings.name }}</strong><small>عقارك أقرب وأسهل</small></span>
    </a>

    <nav class="nav-links">
      <a href="#home">الرئيسية</a>
      <a href="#properties">العقارات</a>
      <a href="#how-it-works">خدماتنا</a>
      <a href="#about">عن سمسار</a>
    </nav>

    <div class="top-actions">
      <button class="icon-button" title="الملف الشخصي" @click="sessionUser ? toast('أهلًا ' + sessionUser.name) : openLogin()">♙</button>
      <button class="icon-button" title="المفضلة" @click="showFavorites = !showFavorites; scrollTo('properties')">
        ♡<sup v-if="favorites.length">{{ favorites.length }}</sup>
      </button>
      <button class="icon-button" title="الإشعارات" @click="notificationsOpen = !notificationsOpen">
        ♧<sup v-if="myNotifications.length">{{ myNotifications.length }}</sup>
      </button>
      <button v-if="sessionUser && ['admin','staff'].includes(sessionUser.role)" class="small-button" @click="openAdmin">لوحة التحكم</button>
      <button v-else-if="sessionUser && sessionUser.role === 'owner'" class="small-button" @click="scrollTo('owner-workspace')">إعلاناتي</button>
      <button v-else-if="!sessionUser" class="login-button" @click="openLogin">تسجيل الدخول</button>
      <button v-else class="small-button" @click="scrollTo('my-viewings')">طلباتي</button>
    </div>

    <div v-if="notificationsOpen" class="notification-popover">
      <div class="row-between">
        <strong>الإشعارات</strong>
        <button class="icon-button" @click="notificationsOpen = false">✕</button>
      </div>
      <p v-if="!myNotifications.length" class="muted">لا توجد إشعارات حاليًا.</p>
      <button v-for="item in myNotifications" :key="item.id" class="notification-item" @click="goToNotification(item)">
        <strong>{{ item.title }}</strong>
        <small>{{ item.description }}</small>
      </button>
    </div>
  </header>

  <main>
    <!-- الواجهة الرئيسية -->
    <section id="home" class="hero">
      <div class="hero-bg"></div>
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <span class="eyebrow">✦ منصة عقارية ذكية</span>
        <h1>اكتشف منزلك القادم<br><em>مع سمسار</em></h1>
        <p>استكشف عقارات البيع والإيجار، قارن الأسعار والمساحات، ونظّم طلب المعاينة من مكان واحد.</p>
        <div class="hero-actions">
          <a href="#properties" class="primary-button">ابدأ البحث ←</a>
          <button class="outline-button" @click="assistantOpen = true">🤖 اسأل المساعد الذكي</button>
        </div>
        <div class="hero-points">
          <span>✓ تجربة بحث واضحة</span>
          <span>✓ صور وتفاصيل العقارات</span>
          <span>✓ تنظيم طلبات المعاينة</span>
        </div>
      </div>

      <div class="hero-illustration">
        <div class="hero-circle"></div>
        <div class="hero-house">
          <div class="house-roof"></div>
          <div class="house-body">
            <div class="house-windows"><i></i><i></i></div>
            <div class="house-balcony"></div>
            <div class="house-windows"><i></i><i></i></div>
            <div class="house-door"></div>
          </div>
        </div>
        <div class="floating-info info-one"><span>⌖</span><div><strong>المكان المناسب</strong><small>حسب احتياجاتك</small></div></div>
        <div class="floating-info info-two"><span>✓</span><div><strong>طلب معاينة</strong><small>في الموعد اللي يناسبك</small></div></div>
      </div>

      <!-- البحث السريع -->

      <div><span>◷</span><strong>تنظيم المعاينة</strong><small>تابع حالة طلبك</small></div>
      <div><span>▣</span><strong>صور العقارات</strong><small>استكشف التفاصيل</small></div>
      <div><span>✧</span><strong>بحث ذكي</strong><small>بمساعدة المساعد</small></div>
    </section>

    <!-- العقارات -->
    <section id="properties" class="section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">اختيارات تناسب احتياجاتك</span>
          <h2>{{ showFavorites ? 'العقارات المحفوظة' : 'أحدث العقارات' }}</h2>

        </div>
        <button v-if="showFavorites" class="outline-light-button" @click="showFavorites = false">عرض كل العقارات</button>
        <span v-else class="demo-badge">بيانات عرض تجريبية</span>
      </div>

      <div class="property-tools">
        <div class="filter-chips">
          <button :class="{active: filters.transaction === 'الكل'}" @click="filters.transaction = 'الكل'">الكل</button>
          <button :class="{active: filters.transaction === 'إيجار'}" @click="filters.transaction = 'إيجار'">للإيجار</button>
          <button :class="{active: filters.transaction === 'بيع'}" @click="filters.transaction = 'بيع'">للبيع</button>
        </div>
        <label class="sort-label">ترتيب حسب
          <select v-model="filters.sort">
            <option value="featured">الأحدث والمميزة</option>
            <option value="price-asc">السعر من الأقل</option>
            <option value="price-desc">السعر من الأعلى</option>
            <option value="rating">أعلى تقييم</option>
          </select>
        </label>
        <strong class="results-count">{{ filteredProperties.length }} عقار</strong>
      </div>

      <div v-if="filteredProperties.length" class="property-grid">
        <article v-for="property in filteredProperties" :key="property.id" class="property-card">
          <div class="property-photo" @click="openProperty(property)">
            <img :src="property.photos[0] || fallbackImage" :alt="property.title" @error="onImageError" />
            <span class="property-badge" :class="property.transaction === 'بيع' ? 'sale-badge' : 'rent-badge'">{{ property.transaction }}</span>
            <span v-if="property.featured" class="featured-badge">مميز</span>
            <button class="favorite-button" :class="{favorited: favorites.includes(property.id)}" @click.stop="toggleFavorite(property.id)" :aria-label="'المفضلة ' + property.title">
              {{ favorites.includes(property.id) ? '♥' : '♡' }}
            </button>
            <span class="photo-count">▧ {{ property.photos.length }} صور</span>
          </div>

          <div class="property-content">
            <div class="property-location">⌖ {{ property.area }} - {{ property.neighborhood }}</div>
            <button class="property-title" @click="openProperty(property)">{{ property.title }}</button>
            <div class="rating-inline">
              <span class="stars">{{ starsText(property.rating) }}</span>
              <strong>{{ Number(property.rating || 0).toFixed(1) }}</strong>
              <small>({{ property.reviews || 0 }} تقييم)</small>
            </div>
            <div class="property-specs">
              <span>▦ {{ property.size }} م²</span>
              <span>♙ {{ property.bedrooms }} غرف</span>
              <span>▤ {{ property.bathrooms }} حمام</span>
            </div>
            <div class="property-bottom">
              <div><strong class="property-price">{{ money(property.price) }}</strong><small>{{ property.transaction === 'إيجار' ? 'شهريًا' : 'السعر الإجمالي' }}</small></div>

            </div>
          </div>
        </article>
      </div>

      <div v-else class="empty-state">
        <span class="empty-symbol">⌕</span>
        <h3>{{ showFavorites ? 'المفضلة فارغة' : 'ملقيناش عقار بالمواصفات دي' }}</h3>
        <p>جرّب تغيير البحث أو الفلاتر.</p>
        <button class="outline-light-button" @click="resetFilters">إعادة ضبط البحث</button>
      </div>
    </section>

    <!-- خطوات الاستخدام -->
    <section id="how-it-works" class="how-section">

        <div><span class="eyebrow">خطوات أوضح ووقت أقل</span><h2>رحلتك لعقارك في 3 خطوات</h2><p>من البحث الأول لحد تنسيق موعد المعاينة.</p></div>
      </div>
      <div class="steps-grid">
        <article class="step-card"><span class="step-no">01</span><div class="step-icon">⌕</div><h3>حدد مواصفاتك</h3><p>اختار المنطقة والميزانية ونوع العقار اللي يناسبك.</p></article>
        <article class="step-card"><span class="step-no">02</span><div class="step-icon">⌂</div><h3>استكشف وقارن</h3><p>شوف الصور والمساحة والسعر والتقييمات في مكان واحد.</p></article>
        <article class="step-card"><span class="step-no">03</span><div class="step-icon">◷</div><h3>اطلب معاينة</h3><p>حدد الموعد والمالك يراجع الطلب أو يقترح موعدًا بديلًا.</p></article>
      </div>
    </section>

    <!-- طلبات العميل -->
    <section v-if="sessionUser && sessionUser.role === 'customer'" id="my-viewings" class="section tinted-section">
      <div class="section-heading"><div><span class="eyebrow">تابع خطواتك</span><h2>طلبات المعاينة</h2></div></div>
      <div v-if="customerViewings.length" class="record-grid">
        <article v-for="request in customerViewings" :key="request.id" class="record-card">
          <div class="row-between"><strong>{{ getProperty(request.propertyId)?.title || 'عقار' }}</strong><span class="status-pill">{{ request.status }}</span></div>
          <p>الموعد المطلوب: {{ request.date }} — {{ request.time }}</p>
          <p v-if="request.alternateDate">الموعد البديل: {{ request.alternateDate }} — {{ request.alternateTime }}</p>
          <div class="inline-actions">
            <button v-if="request.status === 'موعد بديل مقترح'" class="primary-button" @click="acceptAlternate(request)">قبول الموعد البديل</button>
            <button v-if="!['ملغاة من العميل','مرفوضة من المالك','اكتملت المعاينة'].includes(request.status)" class="danger-button" @click="cancelViewing(request)">إلغاء الطلب</button>
          </div>
        </article>
      </div>
      <div v-else class="empty-state">لسه ما قدمتش طلبات معاينة.</div>
    </section>

    <!-- مساحة المالك -->
    <section v-if="sessionUser && sessionUser.role === 'owner'" id="owner-workspace" class="section tinted-section">
      <div class="section-heading">
        <div><span class="eyebrow">مساحة المالك</span><h2>إعلاناتي وطلبات المعاينة</h2><p>أضف عقاراتك وتابع طلبات المعاينة المرتبطة بها.</p></div>
        <button class="primary-button" @click="newListing">＋ إضافة عقار</button>
      </div>

      <div class="owner-stats">
        <div><small>إعلاناتي</small><strong>{{ ownerProperties.length }}</strong></div>
        <div><small>طلبات المعاينة</small><strong>{{ ownerViewings.length }}</strong></div>
        <div><small>بانتظار الرد</small><strong>{{ ownerPendingViewings.length }}</strong></div>
      </div>

      <div v-if="listingFormOpen" class="form-panel">
        <div class="row-between"><h3>{{ editingListingId ? 'تعديل العقار' : 'إضافة عقار جديد' }}</h3><button class="close-button" @click="cancelListingForm">✕</button></div>
        <form @submit.prevent="saveListing">
          <div class="form-grid">
            <label>عنوان الإعلان *<input v-model.trim="listingForm.title" required maxlength="120" /></label>
            <label>نوع العملية *<select v-model="listingForm.transaction"><option>إيجار</option><option>بيع</option></select></label>
            <label>السعر بالجنيه *<input v-model.number="listingForm.price" type="number" min="1" required /></label>
            <label>السعر المقترح<input v-model.number="listingForm.suggestedPrice" type="number" min="0" /></label>
            <label>المحافظة أو المدينة *<input v-model.trim="listingForm.area" required placeholder="القاهرة" /></label>
            <label>المنطقة أو الحي *<input v-model.trim="listingForm.neighborhood" required placeholder="مدينة نصر" /></label>
            <label>نوع العقار *<select v-model="listingForm.type"><option>شقة</option><option>فيلا</option><option>استوديو</option><option>محل تجاري</option></select></label>
            <label>المساحة بالمتر *<input v-model.number="listingForm.size" type="number" min="1" required /></label>
            <label>عدد غرف النوم<input v-model.number="listingForm.bedrooms" type="number" min="0" /></label>
            <label>عدد الحمامات<input v-model.number="listingForm.bathrooms" type="number" min="0" /></label>
            <label>رابط الخريطة (اختياري)<input v-model.trim="listingForm.mapUrl" type="url" placeholder="https://..." /></label>
            <label>تفاصيل العقد<input v-model.trim="listingForm.contractDetails" maxlength="250" /></label>
          </div>

          <label class="wide-label">وصف العقار *<textarea v-model.trim="listingForm.description" rows="4" maxlength="2000" required></textarea></label>
          <label class="wide-label">الخدمات القريبة<input v-model.trim="listingForm.amenitiesText" placeholder="مواصلات، مدارس، سوق..." /></label>

          <div class="upload-panel">
            <div><strong>صور العقار — حتى 10 صور</strong><p class="muted">اضغط على علامة + لاختيار الصور من جهازك. الصور تُضغط تلقائيًا للمعاينة.</p></div>
            <label class="upload-trigger"><span>＋</span> اختيار الصور من الجهاز
              <input type="file" accept="image/*" multiple @change="onListingImages" />
            </label>
            <div class="upload-count">{{ listingForm.previewImages.length }} / 10 صور</div>
            <div class="upload-grid">
              <div v-for="(photo,index) in listingForm.previewImages" :key="photo.key" class="upload-thumb">
                <img :src="photo.src" :alt="'صورة عقار ' + (index+1)" />
                <span v-if="index === 0" class="main-photo-tag">الصورة الرئيسية</span>
                <button type="button" @click="removeListingImage(index)" title="حذف الصورة">✕</button>
              </div>
            </div>
            <p class="hint">في هذه النسخة، الصور محفوظة على المتصفح فقط وليست مرفوعة لخادم سحابي.</p>
          </div>

          <div class="upload-panel">
            <strong>مستندات المالك والعقار</strong>
            <div class="form-grid">
              <label>مستند الهوية<input type="file" accept="image/*,.pdf" @change="onDocumentSelect($event,'identity')" /><small>{{ listingForm.identityDocName || 'لم يتم اختيار ملف' }}</small></label>
              <label>مستند إثبات الملكية<input type="file" accept="image/*,.pdf" @change="onDocumentSelect($event,'ownership')" /><small>{{ listingForm.ownershipDocName || 'لم يتم اختيار ملف' }}</small></label>
            </div>
            <p class="hint">يُسجَّل اسم الملف فقط في النسخة الحالية. لا تستخدم مستندات شخصية حقيقية قبل إعداد تخزين آمن.</p>
          </div>

          <div class="policy-note">رسوم النشر المقترحة: <strong>50 جنيهًا</strong> للإعلان. غير مفعّلة ولن يتم تحصيل أي مبلغ من هذا النموذج.</div>
          <div class="inline-actions"><button class="primary-button" type="submit">حفظ الإعلان التجريبي</button><button class="outline-light-button" type="button" @click="cancelListingForm">إلغاء</button></div>
        </form>
      </div>

      <h3 class="subheading">إعلاناتي</h3>
      <div v-if="ownerProperties.length" class="owner-list-grid">
        <article v-for="property in ownerProperties" :key="property.id" class="owner-card">
          <img :src="property.photos[0] || fallbackImage" :alt="property.title" @error="onImageError" />
          <div class="owner-card-content">
            <span class="status-pill">{{ property.status }}</span>
            <h4>{{ property.title }}</h4>
            <p>{{ property.area }}، {{ property.neighborhood }}</p>
            <strong>{{ money(property.price) }}</strong>
            <div class="inline-actions">
              <button class="outline-light-button" @click="openProperty(property)">عرض</button>
              <button class="outline-light-button" @click="editListing(property)">تعديل</button>
              <button class="danger-button" @click="deleteListing(property)">حذف</button>
            </div>
          </div>
        </article>
      </div>
      <div v-else class="empty-state">لسه مفيش إعلانات مرتبطة بالحساب ده.</div>

      <h3 class="subheading">طلبات معاينة عقاراتي</h3>
      <div v-if="ownerViewings.length" class="record-grid">
        <article v-for="request in ownerViewings" :key="request.id" class="record-card">
          <div class="row-between"><strong>{{ getProperty(request.propertyId)?.title || 'عقار' }}</strong><span class="status-pill">{{ request.status }}</span></div>
          <p>العميل: {{ request.customerName }} — {{ request.phone }}</p>
          <p>الموعد: {{ request.date }} — {{ request.time }}</p>
          <div class="inline-actions">
            <button v-if="request.status === 'بانتظار موافقة المالك'" class="primary-button" @click="updateViewingStatus(request,'تمت الموافقة من المالك')">الموافقة</button>
            <button v-if="request.status === 'بانتظار موافقة المالك'" class="danger-button" @click="updateViewingStatus(request,'مرفوضة من المالك')">رفض</button>
            <button v-if="request.status === 'بانتظار موافقة المالك'" class="outline-light-button" @click="openAlternateForm(request)">موعد بديل</button>
          </div>
          <div v-if="alternateFormId === request.id" class="form-grid alternate-form">
            <label>التاريخ البديل<input v-model="alternateDate" type="date" :min="today" required /></label>
            <label>الوقت البديل<select v-model="alternateTime"><option>10:00</option><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option></select></label>
            <button class="primary-button" @click="suggestAlternate(request)">إرسال الموعد</button>
          </div>
        </article>
      </div>
      <div v-else class="empty-state">لا توجد طلبات معاينة على إعلاناتك حتى الآن.</div>
    </section>

    <!-- قسم تعريفي -->
    <section id="about" class="about-strip">
      <div><span class="eyebrow">عن سمسار</span><h2>نقرّب لك الطريق من البحث للمعاينة</h2><p>واجهة تجريبية لمنصة عقارية تساعد على تنظيم استكشاف العقارات وطلبات المعاينة.</p></div>
      <button class="primary-button" @click="assistantOpen = true">تحدث مع المساعد الذكي</button>
    </section>
  </main>

  <!-- تذييل الصفحة -->
  <footer id="contact" class="footer">
    <div class="footer-main"><a href="#home" class="brand"><span class="brand-mark">⌂</span><span><strong>{{ settings.name }}</strong><small>عقارك أقرب وأسهل</small></span></a><p>{{ settings.tagline }}</p></div>
    <div class="footer-links"><a href="#properties">استكشاف العقارات</a><a href="#how-it-works">خدماتنا</a><button @click="assistantOpen = true">المساعد الذكي</button><button @click="openLogin">دخول الحسابات</button></div>
    <div class="footer-bottom"><small>© {{ currentYear }} {{ settings.name }} — نسخة تجريبية</small><small>البيانات الحالية محلية وليست معاملات حقيقية.</small></div>
  </footer>

  <!-- شريط تنقل الموبايل -->
  <nav class="mobile-bottom-nav">
    <button :class="{active: mobileNav === 'home'}" @click="mobileNav='home'; scrollTo('home')"><span>⌂</span><small>الرئيسية</small></button>
    <button :class="{active: mobileNav === 'search'}" @click="mobileNav='search'; scrollTo('properties')"><span>⌕</span><small>العقارات</small></button>
    <button :class="{active: mobileNav === 'assistant'}" @click="mobileNav='assistant'; assistantOpen = true"><span>🤖</span><small>المساعد</small></button>
    <button :class="{active: mobileNav === 'favorites'}" @click="mobileNav='favorites'; showFavorites=true; scrollTo('properties')"><span>♡</span><small>المفضلة</small></button>
    <button :class="{active: mobileNav === 'account'}" @click="mobileNav='account'; sessionUser ? toast(sessionUser.name) : openLogin()"><span>♙</span><small>حسابي</small></button>
  </nav>

  <!-- المساعد الذكي للعملاء -->
  <button class="assistant-fab" @click="assistantOpen = !assistantOpen"><span>🤖</span> المساعد الذكي</button>
  <div v-if="assistantOpen" class="assistant-panel">
    <div class="assistant-header"><span class="robot-avatar">🤖</span><div><strong>المساعد الذكي</strong><small>مساعد استكشاف تجريبي</small></div><button @click="assistantOpen=false">✕</button></div>
    <div class="assistant-messages">
      <div class="bot-message">أهلًا بيك! قول لي بتدور على إيه، زي شقة للإيجار أو عقار للبيع في القاهرة.</div>
      <div v-for="(message,index) in assistantMessages" :key="index" :class="message.from === 'user' ? 'user-message' : 'bot-message'">{{ message.text }}</div>
    </div>
    <div class="assistant-shortcuts"><button @click="quickAsk('شقة للإيجار')">شقة للإيجار</button><button @click="quickAsk('عقار للبيع')">عقار للبيع</button><button @click="quickAsk('إزاي أطلب معاينة؟')">طلب معاينة</button></div>
    <form class="assistant-input" @submit.prevent="askAssistant"><input v-model.trim="assistantInput" maxlength="300" placeholder="اكتب مواصفات عقارك..." /><button type="submit">➤</button></form>
    <small class="assistant-note">المساعد يعمل بقواعد محلية تجريبية، وليس متصلًا بنموذج AI خارجي.</small>
  </div>

  <!-- تفاصيل العقار والتقييم -->
  <div v-if="selectedProperty" class="overlay" @click.self="selectedProperty=null">

      <div class="modal-heading"><div><span class="eyebrow">{{ selectedProperty.transaction }} · {{ selectedProperty.type }}</span><h2>{{ selectedProperty.title }}</h2><p>⌖ {{ selectedProperty.area }} — {{ selectedProperty.neighborhood }}</p></div><button class="close-button" @click="selectedProperty=null">✕</button></div>
      <div class="detail-gallery"><img v-for="(photo,index) in selectedProperty.photos" :key="photo.key || photo + index" :src="photo.src || photo" :alt="'صورة ' + (index+1)" @error="onImageError" /></div>
      <div class="detail-price"><strong>{{ money(selectedProperty.price) }}</strong><small>{{ selectedProperty.transaction === 'إيجار' ? 'شهريًا' : 'السعر الإجمالي' }}</small></div>
      <div class="detail-specs"><div><span>المساحة</span><strong>{{ selectedProperty.size }} م²</strong></div><div><span>غرف النوم</span><strong>{{ selectedProperty.bedrooms }}</strong></div><div><span>الحمامات</span><strong>{{ selectedProperty.bathrooms }}</strong></div><div><span>النوع</span><strong>{{ selectedProperty.type }}</strong></div></div>
      <h3>عن العقار</h3><p class="detail-description">{{ selectedProperty.description }}</p>
      <h3>الخدمات القريبة</h3><div class="amenities"><span v-for="item in selectedProperty.amenities" :key="item">✓ {{ item }}</span><span v-if="!selectedProperty.amenities.length">اسأل المالك عن الخدمات القريبة.</span></div>
      <p v-if="selectedProperty.contractDetails" class="muted">تفاصيل العقد: {{ selectedProperty.contractDetails }}</p>
      <a v-if="isValidUrl(selectedProperty.mapUrl)" :href="selectedProperty.mapUrl" target="_blank" rel="noopener noreferrer" class="map-link">⌖ فتح موقع العقار على الخريطة</a>

      <div class="detail-footer"><div><small>مالك الإعلان</small><strong>{{ selectedProperty.ownerName || 'مالك العقار' }}</strong></div><button class="primary-button" @click="requestViewing(selectedProperty)">طلب معاينة العقار ←</button></div>
      <p class="hint">تحقق من بيانات المالك والمستندات قبل أي اتفاق فعلي.</p>
    </section>
  </div>

      const type=this.filters.type==='الكل'||p.type===this.filters.type;
      const area=this.filters.area==='الكل'||p.neighborhood===this.filters.area||p.area===this.filters.area;
      const fav=!this.showFavorites||this.favorites.includes(p.id);
      const maySeeUnpublished=p.isBackendRecord&&(p.ownerId===this.sessionUser?.id||['admin','staff'].includes(this.sessionUser?.role));
      const visibleStatus=p.isBackendRecord?(p.backendStatus==='published'||maySeeUnpublished):p.status!=='موقوف';
      return matches&&transaction&&type&&area&&fav&&visibleStatus;
    }).sort((a,b)=>{
      if(this.filters.sort==='price-asc')return a.price-b.price;
      if(this.filters.sort==='price-desc')return b.price-a.price;
      if(this.filters.sort==='rating')return (b.rating||0)-(a.rating||0);
      return Number(b.featured)-Number(a.featured);
    });
  },
  ownerProperties(){
    return this.sessionUser?.role==='owner'?this.properties.filter(p=>p.ownerEmail===this.sessionUser.email):[];
  },
  ownerViewings(){
    const ids=new Set(this.ownerProperties.map(p=>p.id));
    return this.viewings.filter(v=>ids.has(v.propertyId)).sort((a,b)=>b.createdAt-a.createdAt);
  },
  ownerPendingViewings(){
    return this.ownerViewings.filter(v=>v.status==='بانتظار موافقة المالك');
  },
  customerViewings(){
    return this.sessionUser?this.viewings.filter(v=>v.customerEmail===this.sessionUser.email).sort((a,b)=>b.createdAt-a.createdAt):[];
  },
  viewingProperty(){return this.getProperty(this.viewingPropertyId);},
  visibleAdminTabs(){return this.adminTabs.filter(t=>t.roles.includes(this.sessionUser?.role));},
  favoriteProperties(){return this.properties.filter(p=>this.favorites.includes(p.id));},
  myNotifications(){
    if(!this.sessionUser)return [];
    if(this.sessionUser.role==='customer')return this.customerViewings.map(v=>({id:v.id,title:v.status,description:(this.getProperty(v.propertyId)?.title||'عقار')+' · '+v.date,requestId:v.id}));
    if(this.sessionUser.role==='owner')return this.ownerViewings.map(v=>({id:v.id,title:'طلب معاينة',description:(this.getProperty(v.propertyId)?.title||'عقار')+' · '+v.status,requestId:v.id}));
    return this.viewings.slice(0,5).map(v=>({id:v.id,title:v.status,description:(this.getProperty(v.propertyId)?.title||'عقار')+' · '+v.date,requestId:v.id}));
  },
  ratingCount(){return this.properties.reduce((sum,p)=>sum+(Number(p.reviews)||0),0);},
  averageRating(){
    const count=this.ratingCount;
    return count?this.properties.reduce((sum,p)=>sum+(Number(p.rating)||0)*(Number(p.reviews)||0),0)/count:0;
  },
  ratingDistribution(){
    return [5,4,3,2,1].map(stars=>{
      const count=this.properties.reduce((sum,p)=>sum+(Math.round(Number(p.rating)||0)===stars?(Number(p.reviews)||0):0),0);
      return {stars,count,percent:this.ratingCount?Math.round(count/this.ratingCount*100):0};
    });
  },
  listingStatusSummary(){
    const items=[{label:'منشور تجريبي',key:'منشور تجريبي'},{label:'قيد المراجعة',key:'قيد المراجعة التجريبية'},{label:'موقوف',key:'موقوف'}];
    const list=this.properties.filter(p=>this.listingChartFilter==='all'||p.transaction===this.listingChartFilter);
    const total=Math.max(list.length,1);
    return items.map(i=>{
      const count=list.filter(p=>(p.status||'قيد المراجعة التجريبية')===i.key).length;
      return {...i,count,percent:Math.round(count/total*100)};
    });
  },
  recentViewings(){return [...this.viewings].sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);}
},

created(){this.loadDemoData();this.initializeBackend();},

beforeUnmount(){if(this.toastTimer)clearTimeout(this.toastTimer);},

methods:{
  emptyListingForm(){
    return {title:'',transaction:'إيجار',type:'شقة',price:'',suggestedPrice:'',area:'',neighborhood:'',size:'',bedrooms:2,bathrooms:1,description:'',amenitiesText:'',contractDetails:'',mapUrl:'',previewImages:[],identityDocName:'',ownershipDocName:''};
  },
  emptyViewingForm(){return {customerName:'',phone:'',date:'',time:'16:00',note:''};},
  money(value){
    return new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:0}).format(Number(value)||0);
  },
  starsText(value){
    const n=Math.max(0,Math.min(5,Math.round(Number(value)||0)));
    return '★'.repeat(n)+'☆'.repeat(5-n);
  },
  toast(message){
    this.toastMessage=message;
    if(this.toastTimer)clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>this.toastMessage='',3200);
  },
  scrollTo(id){
    this.$nextTick(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}));
  },
  resetFilters(){this.filters={query:'',transaction:'الكل',type:'الكل',area:'الكل',sort:'featured'};this.showFavorites=false;},
  isValidUrl(value){
    try{const u=new URL(value);return u.protocol==='https:'||u.protocol==='http:';}catch{return false;}
  },
  onImageError(event){
    if(event.target&&!event.target.dataset.fallbackApplied){
      event.target.dataset.fallbackApplied='true';
      event.target.src=this.fallbackImage;
    }
  },
  loadDemoData(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw)return;
      const saved=JSON.parse(raw);
      if(Array.isArray(saved.properties))this.properties=saved.properties.map(p=>({...p,photos:Array.isArray(p.photos)&&p.photos.length?p.photos.map(photo=>typeof photo==='string'?{key:makeId('photo'),src:photo}:photo):[{key:makeId('photo'),src:this.fallbackImage}],amenities:Array.isArray(p.amenities)?p.amenities:[]}));
      if(Array.isArray(saved.viewings))this.viewings=saved.viewings;
      if(Array.isArray(saved.favorites))this.favorites=saved.favorites;
      if(saved.userRatings)this.userRatings=saved.userRatings;
      if(saved.settings)this.settings={...defaultSettings(),...saved.settings};
    }catch(error){console.warn('تعذر تحميل البيانات التجريبية:',error);}
  },
  persistDemo(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({properties:this.properties,viewings:this.viewings,favorites:this.favorites,userRatings:this.userRatings,settings:this.settings}));
    }catch(error){
      console.warn('تعذر حفظ البيانات محليًا:',error);
      this.toast('مساحة التخزين في المتصفح ممتلئة. قلل عدد الصور.');
    }
  },
  async initializeBackend(){
    if(!supabaseClient){this.backendAvailable=false;this.backendError='تعذر تحميل مكتبة الاتصال؛ جرّب تحديث الصفحة.';return;}
    this.backendAvailable=true;
    try{
      const {data:{session},error}=await supabaseClient.auth.getSession();
      if(error)throw error;
      if(session)await this.syncAuthSession(session);
      await this.loadBackendProperties();
      await this.loadBackendViewings();
      const {data:{subscription}}=supabaseClient.auth.onAuthStateChange((_event,session)=>{
        setTimeout(async()=>{
          try{await this.syncAuthSession(session);await this.loadBackendProperties();await this.loadBackendViewings();}
          catch(error){console.error('Samsar auth refresh failed:',error);this.backendError='تعذر تحديث بيانات الحساب من قاعدة البيانات.';}
        },0);
      });
      this.authSubscription=subscription;this.backendReady=true;this.backendError='';
    }catch(error){console.error('Samsar backend initialization failed:',error);this.backendError='تعذر الاتصال بقاعدة البيانات حاليًا؛ البيانات الظاهرة قد تكون تجريبية.';}
  },
  async syncAuthSession(session){
    if(!session?.user){if(this.sessionUser?.isSupabaseUser)this.sessionUser=null;return;}
    const user=session.user;let profile=null;
    try{const {data,error}=await supabaseClient.from('profiles').select('full_name,phone,whatsapp_phone,role').eq('id',user.id).maybeSingle();if(error)throw error;profile=data;}
    catch(error){console.error('Could not load Samsar profile:',error);}
    this.sessionUser={id:user.id,email:user.email||'',name:profile?.full_name||user.user_metadata?.full_name||user.email||'مستخدم سمسار',phone:profile?.phone||user.phone||'',role:profile?.role||'customer',isSupabaseUser:true};
  },
  async loadBackendProperties(){
    if(!supabaseClient)return;
    const {data,error}=await supabaseClient.from('properties').select('*, property_images(*), property_amenities(*), owner:profiles!properties_owner_id_fkey(full_name)').order('created_at',{ascending:false});
    if(error)throw error;
    const rows=Array.isArray(data)?data:[];
    if(rows.length){this.properties=rows.map(row=>this.mapBackendProperty(row));this.dataMode='live';}
    else if(this.sessionUser?.isSupabaseUser){this.properties=[];this.dataMode='live';}
    else{this.properties=defaultProperties().map(p=>({...p,isDemo:true}));this.dataMode='demo';}
    this.backendError='';
  },
  mapBackendProperty(row){
    const typeNames={apartment:'شقة',villa:'فيلا',studio:'ستوديو',room:'غرفة',duplex:'دوبلكس',penthouse:'بنتهاوس',chalet:'شاليه',commercial:'تجاري',other:'أخرى'};
    const statusNames={draft:'مسودة',pending_review:'قيد المراجعة',published:'منشور',rejected:'مرفوض',rented:'مؤجر',archived:'مؤرشف'};
    const images=(row.property_images||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(item=>{
      const {data}=supabaseClient.storage.from('property-images').getPublicUrl(item.storage_path);
      return {key:item.id,src:data.publicUrl,storagePath:item.storage_path,altText:item.alt_text||'',isCover:!!item.is_cover};
    });
    const amenities=(row.property_amenities||[]).map(item=>item.amenity_name).filter(Boolean);
    return {id:row.id,listingCode:row.listing_code,isBackendRecord:true,isDemo:false,ownerId:row.owner_id,
      title:row.title,description:row.description||'',transaction:row.listing_type==='rent'?'إيجار':'بيع',type:typeNames[row.property_type]||'أخرى',
      price:Number(row.listing_type==='rent'?row.monthly_rent_egp:row.sale_price_egp)||0,suggestedPrice:Number(row.suggested_price_egp)||0,
      area:row.governorate||row.city||'',neighborhood:row.district||'',size:Number(row.area_sqm)||0,bedrooms:Number(row.bedrooms)||0,bathrooms:Number(row.bathrooms)||0,
      contractDetails:row.contract_details||'',mapUrl:row.map_url||'',amenities,photos:images,ownerEmail:row.owner_id===this.sessionUser?.id?this.sessionUser?.email||'':'',
      ownerName:row.owner?.full_name||(row.owner_id===this.sessionUser?.id?this.sessionUser?.name:'')||'مالك العقار',featured:false,status:statusNames[row.status]||row.status,backendStatus:row.status,
      rating:0,reviews:0,identityDocName:'',ownershipDocName:'',createdAt:row.created_at,publishedAt:row.published_at,verifiedAt:row.verified_at};
  },
  async loadBackendViewings(){
    if(!supabaseClient||!this.sessionUser?.isSupabaseUser){if(!this.sessionUser?.isSupabaseUser)this.viewings=[];return;}
    const {data,error}=await supabaseClient.from('viewing_requests').select('*').order('created_at',{ascending:false});if(error)throw error;
    const states={requested:'بانتظار موافقة المالك',owner_proposed:'موعد بديل مقترح',customer_proposed:'موعد بديل من العميل',confirmed:'تمت الموافقة من المالك',completed:'اكتملت المعاينة',cancelled:'ملغاة من العميل',rejected:'مرفوضة من المالك'};
    const parts=value=>{if(!value)return {date:'',time:'16:00'};const d=new Date(value);const pad=n=>String(n).padStart(2,'0');return {date:String(d.getFullYear())+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),time:pad(d.getHours())+':'+pad(d.getMinutes())};};
    this.viewings=(data||[]).map(row=>{const scheduled=parts(row.scheduled_at),alternate=parts(row.owner_proposed_scheduled_at);return {
      id:row.id,propertyId:row.property_id,customerId:row.customer_id,ownerId:row.owner_id,customerEmail:row.customer_id===this.sessionUser.id?this.sessionUser.email:'',
      customerName:row.customer_name||'',phone:row.customer_phone||'',date:scheduled.date,time:scheduled.time,note:row.customer_note||'',ownerNote:row.owner_note||'',
      alternateDate:alternate.date,alternateTime:alternate.time,ownerProposedScheduledAt:row.owner_proposed_scheduled_at||'',status:states[row.status]||row.status,backendStatus:row.status,isBackendRecord:true,createdAt:new Date(row.created_at).getTime()||0};});
  },
  getProperty(id){return this.properties.find(p=>p.id===id);},
  openProperty(property){this.selectedProperty=property;},
  toggleFavorite(id){
    const p=this.getProperty(id);
    const i=this.favorites.indexOf(id);
    if(i>=0)this.favorites.splice(i,1);else this.favorites.push(id);
    this.persistDemo();
    this.toast(p?.isBackendRecord?'المفضلة في هذه النسخة محفوظة على هذا المتصفح فقط.':(i>=0?'تمت إزالة العقار من المفضلة':'تم حفظ العقار في المفضلة'));
  },
  rateProperty(property,stars){
    if(property?.isBackendRecord){this.toast('حفظ التقييمات في قاعدة البيانات سيتم تفعيله في مرحلة مستقلة.');return;}
    if(!this.sessionUser){this.toast('سجّل الدخول بحساب العميل لإضافة تقييم تجريبي.');return;}
    if(this.sessionUser.role!=='customer'){this.toast('التقييم متاح لحساب العميل في هذه المعاينة.');return;}
    if(this.userRatings[property.id]){this.toast('تم تسجيل تقييمك لهذا العقار بالفعل.');return;}
    const oldCount=Number(property.reviews)||0;
    const oldRating=Number(property.rating)||0;
    property.rating=Number(((oldRating*oldCount+stars)/(oldCount+1)).toFixed(1));
    property.reviews=oldCount+1;
    this.userRatings[property.id]=stars;
    this.persistDemo();
    this.toast('تم حفظ تقييمك محليًا.');
  },
  openLogin(){this.loginError='';this.loginOpen=true;},
  async login(){
    if(!supabaseClient){this.loginError='الاتصال بقاعدة البيانات غير متاح الآن.';return;}
    const email=this.loginForm.email.trim().toLowerCase(),password=this.loginForm.password;this.loginError='';
    try{
      if(this.authMode==='signup'){
        if(this.signupName.trim().length<2){this.loginError='اكتب اسمك بالكامل.';return;}
        const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:this.signupName.trim()}}});if(error)throw error;
        if(data.session){await this.syncAuthSession(data.session);await this.loadBackendProperties();await this.loadBackendViewings();this.loginOpen=false;this.toast('تم إنشاء الحساب. حسابك يبدأ كعميل.');}
        else{this.authMode='signin';this.toast('تم إرسال تعليمات تأكيد الحساب إلى بريدك الإلكتروني إذا كان تأكيد البريد مطلوبًا.');}
      }else{
        const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;
        await this.syncAuthSession(data.session);await this.loadBackendProperties();await this.loadBackendViewings();this.loginOpen=false;this.toast('تم تسجيل الدخول بنجاح.');
        if(this.pendingPropertyId&&this.sessionUser?.role==='customer'){const property=this.getProperty(this.pendingPropertyId);this.pendingPropertyId='';if(property)this.openViewingModal(property);}
        else if(this.pendingPropertyId){this.pendingPropertyId='';this.toast('طلب المعاينة متاح لحساب العميل.');}
      }
      this.loginForm={email:'',password:''};
    }catch(error){console.error('Samsar authentication failed:',error);this.loginError=error?.message||'تعذر إكمال العملية. راجع البريد وكلمة المرور وحاول مرة أخرى.';}
  },
  async logout(){
    const wasBackendUser=!!this.sessionUser?.isSupabaseUser;
    if(wasBackendUser&&supabaseClient){const {error}=await supabaseClient.auth.signOut();if(error){this.toast('تعذر تسجيل الخروج من الخادم.');return;}}
    this.sessionUser=null;this.adminOpen=false;this.loginOpen=false;this.listingFormOpen=false;this.selectedProperty=null;this.viewingOpen=false;
    if(wasBackendUser&&supabaseClient){try{await this.loadBackendProperties();this.viewings=[];}catch(error){console.error(error);}}
    this.toast('تم تسجيل الخروج.');
  },
  openLogin(){this.loginError='';this.authMode='signin';this.loginOpen=true;},
  requestViewing(property){
    if(!property?.isBackendRecord){this.toast('هذا العقار معروض كبيانات تجريبية؛ طلب المعاينة الحقيقي يتطلب إعلانًا منشورًا في قاعدة البيانات.');return;}
    if(!this.sessionUser){this.pendingPropertyId=property.id;this.selectedProperty=null;this.openLogin();this.toast('سجّل الدخول بحساب العميل لإرسال طلب المعاينة.');return;}
    if(this.sessionUser.role!=='customer'){this.toast('طلب المعاينة متاح لحساب العميل.');return;}
    this.openViewingModal(property);
  },
  openViewingModal(property){this.viewingPropertyId=property.id;this.viewingForm=this.emptyViewingForm();this.viewingForm.customerName=this.sessionUser?.name||'';this.viewingOpen=true;this.selectedProperty=null;},
  async submitViewing(){
    if(this.sessionUser?.role!=='customer'||!this.sessionUser?.isSupabaseUser){this.toast('سجّل الدخول بحساب عميل حقيقي لإرسال الطلب.');return;}
    const property=this.viewingProperty,form=this.viewingForm;
    if(!property?.isBackendRecord||!form.customerName||!form.phone||!form.date||form.date<this.today){this.toast('راجع البيانات واختار تاريخًا صحيحًا لعقار منشور.');return;}
    try{
      const scheduledAt=new Date(form.date+'T'+(form.time||'16:00')+':00').toISOString();
      const {error}=await supabaseClient.from('viewing_requests').insert({property_id:property.id,customer_id:this.sessionUser.id,owner_id:property.ownerId,customer_name:form.customerName,customer_phone:form.phone,scheduled_at:scheduledAt,customer_note:form.note||null,status:'requested'});
      if(error)throw error;await this.loadBackendViewings();this.viewingOpen=false;this.toast('تم إرسال طلب المعاينة إلى قاعدة البيانات.');
    }catch(error){console.error('Samsar viewing request failed:',error);this.toast('تعذر حفظ طلب المعاينة. تأكد أن العقار منشور وحاول مرة أخرى.');}
  },
  async updateViewingStatus(request,status){
    if(request?.isBackendRecord){
      if(!this.sessionUser?.isSupabaseUser){this.toast('سجّل الدخول أولًا.');return;}
      const states={'تمت الموافقة من المالك':'confirmed','تم قبول الموعد البديل':'confirmed','اكتملت المعاينة':'completed','ملغاة من العميل':'cancelled','مرفوضة من المالك':'rejected','بانتظار موافقة المالك':'requested'};
      const dbStatus=states[status];if(!dbStatus){this.toast('حالة الطلب غير معروفة.');return;}
      const payload={status:dbStatus};if(dbStatus==='confirmed')payload.confirmed_at=new Date().toISOString();if(dbStatus==='cancelled')payload.cancelled_by=this.sessionUser.id;
      try{const {error}=await supabaseClient.from('viewing_requests').update(payload).eq('id',request.id);if(error)throw error;await this.loadBackendViewings();this.toast('تم تحديث حالة طلب المعاينة.');}
      catch(error){console.error('Samsar viewing update failed:',error);this.toast('تعذر تحديث حالة الطلب؛ قد لا تملك الصلاحية المطلوبة.');}return;
    }
    const row=this.viewings.find(v=>v.id===request.id);if(!row)return;row.status=status;this.persistDemo();this.toast('تم تحديث الحالة محليًا فقط.');
  },
  cancelViewing(request){if(!confirm('هل تريد إلغاء طلب المعاينة؟'))return;this.updateViewingStatus(request,'ملغاة من العميل');},
  async acceptAlternate(request){
    if(request?.isBackendRecord){try{const {error}=await supabaseClient.from('viewing_requests').update({status:'confirmed',scheduled_at:request.ownerProposedScheduledAt,confirmed_at:new Date().toISOString()}).eq('id',request.id);if(error)throw error;await this.loadBackendViewings();this.toast('تم تأكيد الموعد البديل.');}catch(error){console.error(error);this.toast('تعذر قبول الموعد البديل؛ حاول مرة أخرى.');}return;}
    const row=this.viewings.find(v=>v.id===request.id);if(!row||!row.alternateDate)return;row.date=row.alternateDate;row.time=row.alternateTime;row.status='تم قبول الموعد البديل';this.persistDemo();this.toast('تم قبول الموعد البديل في بيانات المعاينة فقط.');
  },
  openAlternateForm(request){this.alternateFormId=request.id;this.alternateDate=request.date>=this.today?request.date:this.today;this.alternateTime=request.time||'16:00';},
  async suggestAlternate(request){
    if(!this.alternateDate||this.alternateDate<this.today){this.toast('اختار تاريخًا صحيحًا.');return;}
    if(request?.isBackendRecord){try{const proposed=new Date(this.alternateDate+'T'+(this.alternateTime||'16:00')+':00').toISOString();const {error}=await supabaseClient.from('viewing_requests').update({status:'owner_proposed',owner_proposed_scheduled_at:proposed}).eq('id',request.id);if(error)throw error;await this.loadBackendViewings();this.alternateFormId='';this.toast('تم إرسال الموعد البديل إلى العميل.');}catch(error){console.error(error);this.toast('تعذر إرسال الموعد البديل؛ راجع صلاحيات المالك.');}return;}
    const row=this.viewings.find(v=>v.id===request.id);if(!row)return;row.alternateDate=this.alternateDate;row.alternateTime=this.alternateTime;row.status='موعد بديل مقترح';this.alternateFormId='';this.persistDemo();this.toast('تم تسجيل الموعد البديل محليًا فقط.');
  },
  newListing(){
    if(this.sessionUser?.role!=='owner'){this.toast('إضافة العقار متاحة لحساب المالك التجريبي.');return;}
    this.editingListingId='';this.listingForm=this.emptyListingForm();this.listingFormOpen=true;
    this.$nextTick(()=>this.scrollTo('owner-workspace'));
  },
  editListing(property){
    if(this.sessionUser?.role!=='owner'||property.ownerEmail!==this.sessionUser.email){this.toast('لا تملك صلاحية تعديل هذا الإعلان.');return;}
    this.editingListingId=property.id;
    this.listingForm={title:property.title,transaction:property.transaction,type:property.type,price:property.price,suggestedPrice:property.suggestedPrice||'',area:property.area,neighborhood:property.neighborhood,size:property.size,bedrooms:property.bedrooms,bathrooms:property.bathrooms,description:property.description,amenitiesText:(property.amenities||[]).join('، '),contractDetails:property.contractDetails||'',mapUrl:property.mapUrl||'',previewImages:(property.photos||[]).map(photo=>({...photo})),identityDocName:property.identityDocName||'',ownershipDocName:property.ownershipDocName||''};
    this.listingFormOpen=true;
  },
  cancelListingForm(){this.listingFormOpen=false;this.editingListingId='';this.listingForm=this.emptyListingForm();},
  compressImage(file){
    return new Promise((resolve,reject)=>{
      const image=new Image();
      const url=URL.createObjectURL(file);
      image.onload=()=>{
        try{
          const max=1280;
          const scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
          const canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
          canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
          const ctx=canvas.getContext('2d');
          if(!ctx)throw new Error('Canvas is unavailable');
          ctx.drawImage(image,0,0,canvas.width,canvas.height);
          const src=canvas.toDataURL('image/jpeg',0.68);
          URL.revokeObjectURL(url);
          resolve(src);
        }catch(error){URL.revokeObjectURL(url);reject(error);}
      };
      image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('تعذر قراءة الصورة'));};
      image.src=url;
    });
  },
  async onListingImages(event){
    const files=Array.from(event.target.files||[]);
    if(!files.length)return;
    const remaining=10-this.listingForm.previewImages.length;
    if(remaining<=0){this.toast('الحد الأقصى 10 صور للعقار.');event.target.value='';return;}
    const chosen=files.filter(f=>f.type.startsWith('image/')).slice(0,remaining);
    if(chosen.length<files.length)this.toast('يمكن إضافة 10 صور فقط، والملفات لازم تكون صورًا.');
    for(const file of chosen){
      if(file.size>15*1024*1024){this.toast('تم تجاهل صورة أكبر من 15 ميجابايت.');continue;}
      try{const src=await this.compressImage(file);this.listingForm.previewImages.push({key:makeId('photo'),src});}
      catch{this.toast('تعذر فتح إحدى الصور. جرّب صورة أخرى.');}
    }
    event.target.value='';
  },
  removeListingImage(index){this.listingForm.previewImages.splice(index,1);},
  onDocumentSelect(event,kind){
    const file=event.target.files?.[0];
    if(!file)return;
    if(kind==='identity')this.listingForm.identityDocName=file.name;
    if(kind==='ownership')this.listingForm.ownershipDocName=file.name;
    this.toast('تم حفظ اسم الملف للعرض فقط ولم يتم رفع المستند.');
    event.target.value='';
  },
  async saveListing(){
    if(this.sessionUser?.role!=='owner'||!this.sessionUser?.isSupabaseUser){this.toast('تسجيل الدخول بحساب مالك معتمد مطلوب لنشر إعلان حقيقي.');return;}
    const f=this.listingForm;
    if(!f.title||!f.area||!f.neighborhood||!f.description||Number(f.price)<=0||Number(f.size)<=0){this.toast('راجع العنوان والمنطقة والوصف والسعر والمساحة.');return;}
    if(f.mapUrl&&!this.isValidUrl(f.mapUrl)){this.toast('رابط الخريطة غير صحيح.');return;}
    if(f.previewImages.length>10){this.toast('الحد الأقصى 10 صور.');return;}
    const old=this.editingListingId?this.getProperty(this.editingListingId):null;
    const typeToDb={'شقة':'apartment','فيلا':'villa','ستوديو':'studio','غرفة':'room','دوبلكس':'duplex','بنتهاوس':'penthouse','شاليه':'chalet','تجاري':'commercial','أخرى':'other'};
    const listingType=f.transaction==='إيجار'?'rent':'sale';
    const payload={title:f.title,description:f.description,property_type:typeToDb[f.type]||'other',listing_type:listingType,
      monthly_rent_egp:listingType==='rent'?Number(f.price):null,sale_price_egp:listingType==='sale'?Number(f.price):null,
      suggested_price_egp:Number(f.suggestedPrice)||null,bedrooms:Number(f.bedrooms)||0,bathrooms:Number(f.bathrooms)||0,area_sqm:Number(f.size),
      governorate:f.area,city:f.area,district:f.neighborhood,address_text:f.neighborhood,contract_details:f.contractDetails||null,map_url:f.mapUrl||null};
    try{
      let propertyId;
      if(old?.isBackendRecord){const {data,error}=await supabaseClient.from('properties').update(payload).eq('id',old.id).select('id').single();if(error)throw error;propertyId=data.id;}
      else{const {data,error}=await supabaseClient.from('properties').insert({...payload,owner_id:this.sessionUser.id,status:'draft',owner_fee_status:'unpaid',verified_at:null,rejection_reason:null,published_at:null}).select('id').single();if(error)throw error;propertyId=data.id;}
      const {data:currentImages,error:imageReadError}=await supabaseClient.from('property_images').select('id,storage_path').eq('property_id',propertyId);if(imageReadError)throw imageReadError;
      const retainedIds=new Set(f.previewImages.filter(photo=>photo.storagePath).map(photo=>photo.key));
      const stale=(currentImages||[]).filter(item=>!retainedIds.has(item.id));
      if(stale.length){const stalePaths=stale.map(item=>item.storage_path).filter(Boolean);if(stalePaths.length){const {error:storageError}=await supabaseClient.storage.from('property-images').remove(stalePaths);if(storageError)throw storageError;}const {error:deleteError}=await supabaseClient.from('property_images').delete().in('id',stale.map(item=>item.id));if(deleteError)throw deleteError;}
      const rowsToAdd=[];
      for(let index=0;index<f.previewImages.length;index++){
        const photo=f.previewImages[index];
        if(photo.storagePath){const {error:updateImageError}=await supabaseClient.from('property_images').update({sort_order:index,is_cover:index===0}).eq('id',photo.key).eq('property_id',propertyId);if(updateImageError)throw updateImageError;continue;}
        if(!photo.src?.startsWith('data:image/'))continue;
        const response=await fetch(photo.src);const blob=await response.blob();if(blob.size>10*1024*1024)throw new Error('حجم الصورة أكبر من الحد المسموح في التخزين.');
        const path=this.sessionUser.id+'/'+propertyId+'/'+makeId('image')+'.jpg';
        const {error:uploadError}=await supabaseClient.storage.from('property-images').upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});if(uploadError)throw uploadError;
        rowsToAdd.push({property_id:propertyId,storage_path:path,alt_text:f.title,sort_order:index,is_cover:index===0});
      }
      if(rowsToAdd.length){const {error:insertImagesError}=await supabaseClient.from('property_images').insert(rowsToAdd);if(insertImagesError)throw insertImagesError;}
      const {error:amenityDeleteError}=await supabaseClient.from('property_amenities').delete().eq('property_id',propertyId);if(amenityDeleteError)throw amenityDeleteError;
      const amenities=f.amenitiesText.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
      if(amenities.length){const {error:amenityInsertError}=await supabaseClient.from('property_amenities').insert(amenities.map(amenity_name=>({property_id:propertyId,amenity_name,category:'general',distance_meters:null})));if(amenityInsertError)throw amenityInsertError;}
      await this.loadBackendProperties();this.cancelListingForm();this.toast(old?.isBackendRecord?'تم حفظ تعديلات العقار.':'تم حفظ الإعلان كمسودة تنتظر مراجعة الإدارة.');
    }catch(error){console.error('Samsar listing save failed:',error);this.toast(error?.message||'تعذر حفظ الإعلان. تحقق من صلاحية حساب المالك والصور وحاول مجددًا.');}
  },
  async deleteListing(property){
    if(property.ownerEmail!==this.sessionUser?.email||this.sessionUser?.role!=='owner'){this.toast('لا تملك صلاحية حذف الإعلان.');return;}
    if(!confirm('حذف الإعلان؟'))return;
    if(property.isBackendRecord){try{const {error}=await supabaseClient.from('properties').delete().eq('id',property.id);if(error)throw error;await this.loadBackendProperties();this.toast('تم حذف المسودة.');}catch(error){console.error(error);this.toast('يمكن حذف المسودات فقط؛ الإعلان المنشور يحتاج إيقافه أو أرشفته من الإدارة.');}return;}
    this.properties=this.properties.filter(p=>p.id!==property.id);this.persistDemo();this.toast('تم حذف الإعلان التجريبي محليًا.');
  },
  async changeListingStatus(id,status){
    if(!['admin','staff'].includes(this.sessionUser?.role)){this.toast('لا توجد صلاحية لتعديل الحالة.');return;}
    const p=this.getProperty(id);if(!p)return;
    if(p.isBackendRecord){
      if(this.sessionUser?.role!=='admin'){this.toast('تغيير حالة إعلان حقيقي متاح لمدير النظام فقط.');return;}
      const map={'منشور تجريبي':'published','منشور':'published','قيد المراجعة التجريبية':'pending_review','قيد المراجعة':'pending_review','مسودة':'draft','موقوف':'archived','مؤرشف':'archived','مرفوض':'rejected','مؤجر':'rented'};
      const dbStatus=map[status];if(!dbStatus){this.toast('الحالة المطلوبة غير معروفة.');return;}
      const now=new Date().toISOString(),patch={status:dbStatus};
      if(dbStatus==='published'){patch.published_at=p.publishedAt||now;patch.verified_at=p.verifiedAt||now;patch.rejection_reason=null;}
      else if(dbStatus==='rejected')patch.rejection_reason='تم الرفض من الإدارة';
      try{const {error}=await supabaseClient.from('properties').update(patch).eq('id',p.id);if(error)throw error;await this.loadBackendProperties();this.toast('تم تحديث حالة الإعلان في قاعدة البيانات.');}
      catch(error){console.error(error);this.toast('تعذر تحديث الحالة؛ تأكد من صلاحيات الإدارة.');}return;
    }
    p.status=status;this.persistDemo();this.toast('تم تحديث حالة البيانات التجريبية محليًا.');
  },
  openAdmin(){
    if(!this.sessionUser||!['admin','staff'].includes(this.sessionUser.role)){this.openLogin();this.toast('سجّل الدخول بحساب الإدارة أو الموظف التجريبي.');return;}
    this.adminOpen=true;
    const valid=this.visibleAdminTabs.map(t=>t.id);
    if(!valid.includes(this.adminTab))this.adminTab=valid[0]||'overview';
  },
  closeAdmin(){this.adminOpen=false;},
  saveSettings(){this.settings.name=this.settings.name.trim()||'سمسار';this.persistDemo();this.toast('تم حفظ إعدادات الشكل على هذا المتصفح فقط؛ إعدادات المنصة المالية لا تتغير من هنا.');},
  statusClass(status){if(['تمت الموافقة من المالك','تم قبول الموعد البديل','اكتملت المعاينة'].includes(status))return 'good';if(['مرفوضة من المالك','ملغاة من العميل','موقوف'].includes(status))return 'bad';if(['بانتظار موافقة المالك','موعد بديل مقترح','قيد المراجعة التجريبية'].includes(status))return 'pending';return '';},
  goToNotification(item){this.notificationsOpen=false;if(this.sessionUser?.role==='owner')this.scrollTo('owner-workspace');else if(['admin','staff'].includes(this.sessionUser?.role))this.openAdmin();else this.scrollTo('my-viewings');},
  quickAsk(text){this.assistantInput=text;this.askAssistant();},
  askAssistant(){
    const question=this.assistantInput.trim();if(!question)return;
    this.assistantMessages.push({from:'user',text:question});
    const q=question.toLocaleLowerCase('ar');
    let reply='استخدم البحث وحدد المنطقة والميزانية ونوع العقار. البيانات الظاهرة تجريبية.';
    if(q.includes('إيجار')||q.includes('للايجار')||q.includes('للإيجار')){this.filters.transaction='إيجار';reply='عرضت لك العقارات المتاحة للإيجار حسب بيانات المعاينة. يمكنك اختيار المنطقة ونوع العقار.';}
    else if(q.includes('بيع')||q.includes('للبيع')){this.filters.transaction='بيع';reply='عرضت لك العقارات المعروضة للبيع. استخدم الفلاتر لمزيد من التحديد.';}
    else if(q.includes('معاينة'))reply='افتح تفاصيل العقار واضغط «طلب معاينة العقار». سجّل الدخول بحساب العميل التجريبي. هذه ليست حجوزات فعلية.';
    else if(q.includes('تقييم'))reply='التقييمات في هذه النسخة محلية وتجريبية. افتح تفاصيل العقار وسجّل الدخول بحساب العميل لتجربة التقييم.';
    else{
      const area=this.availableAreas.find(a=>q.includes(a.toLocaleLowerCase('ar')));
      if(area){this.filters.area=area;reply='تم تحديد المنطقة: '+area+'.';}
    }
    this.assistantMessages.push({from:'bot',text:reply});this.assistantInput='';
    if(q.includes('إيجار')||q.includes('بيع'))this.scrollTo('properties');
  },
  askStaffAssistant(){
    const q=this.staffAssistantInput.trim().toLocaleLowerCase('ar');if(!q)return;
    this.staffAssistantReply=q.includes('معاينة')||q.includes('طلب')?'افتح تبويب «طلبات المعاينة» لمراجعة التواريخ والحالات.':q.includes('عقار')||q.includes('إعلان')?'افتح تبويب «العقارات» لمراجعة بيانات الإعلانات وحالاتها.':'راجع العقارات وطلبات المعاينة، وتأكد من التحقق من البيانات قبل اتخاذ أي إجراء. المساعد توضيحي ولا يرسل رسائل خارجية.';
    this.staffAssistantInput='';
  },
  exportBackup(){
    const payload={exportedAt:new Date().toISOString(),note:'بيانات تجريبية محلية وليست معاملات حقيقية.',properties:this.properties,viewings:this.viewings,favorites:this.favorites,userRatings:this.userRatings,settings:this.settings};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download='samsar-demo-backup.json';link.click();URL.revokeObjectURL(url);
    this.toast('تم تجهيز نسخة البيانات التجريبية.');
  }
}
};

Vue.createApp(SamsarApp).mount('#app');

</script>
