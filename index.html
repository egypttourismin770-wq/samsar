      if(isAdmin&&dbStatus==='published'){patch.published_at=p.publishedAt||now;patch.verified_at=p.verifiedAt||now;patch.rejection_reason=null;}
      else if(isAdmin&&dbStatus==='rejected')patch.rejection_reason='تم الرفض من الإدارة';
      try{const {error}=await supabaseClient.from('properties').update(patch).eq('id',p.id);if(error)throw error;await this.loadBackendProperties();this.toast('تم تحديث حالة الإعلان في قاعدة البيانات.');}
      catch(error){console.error(error);this.toast('تعذر تحديث الحالة؛ تأكد من صلاحيات الإدارة.');}return;
    }
    p.status=status;this.persistDemo();this.toast('تم تحديث حالة البيانات التجريبية محليًا.');
  },
  openAdmin(){
    if(!this.sessionUser||!['admin','staff'].includes(this.sessionUser.role)){this.openLogin();this.toast('سجّل الدخول بحساب مدير النظام أو الموظف المعتمد.');return;}
    this.adminRouteMode=this.sessionUser.role==='admin'?'admin':'staff';
    this.adminOpen=true;
    const valid=this.visibleAdminTabs.map(t=>t.id);
    if(!valid.includes(this.adminTab))this.adminTab=valid[0]||'overview';
  },
  navigateWorkspace(role){window.location.href=role==='staff'?'./staff.html':'./admin.html';},
  closeAdmin(){if(['admin','employees','settings','staff'].includes(this.adminRouteMode))return;this.adminOpen=false;},
  normalizeWhatsAppNumber(value){const digits=String(value||'').replace(/\D/g,'');return digits.startsWith('00')?digits.slice(2):digits;},
  whatsappLink(property=null){
    const phone=this.normalizeWhatsAppNumber(this.settings.whatsappPhone);
    if(!phone||!/^[0-9]{8,15}$/.test(phone))return '';
    const title=property&&property.title?('بخصوص الإعلان: '+property.title+' ('+(property.listingCode||property.id||'بدون رقم')+')'):'بخصوص منصة سمسار';
    const message='السلام عليكم، أتواصل من خلال موقع سمسار. '+title+'. أرجو تزويدي بالتفاصيل.';
    return 'https://wa.me/'+phone+'?text='+encodeURIComponent(message);
  },
  openWhatsApp(property=null){
    const link=this.whatsappLink(property);
    if(!link){this.toast('رقم واتساب الرسمي غير مُعدّ بعد. ادخل لوحة الإدارة ثم الإعدادات وسجّل الرقم بالصيغة الدولية.');return;}
    window.open(link,'_blank','noopener,noreferrer');
  },
  changeAIProvider(provider){
    this.aiSettings.provider=provider;
    if(provider==='openai'){
      this.aiSettings.base_url='https://api.openai.com/v1';
      if(!this.aiSettings.model)this.aiSettings.model='gpt-5-mini';
    }else if(this.aiSettings.base_url==='https://api.openai.com/v1'){
      this.aiSettings.base_url='';
    }
  },
  async testAIConnection(){
    if(this.sessionUser?.role!=='admin'||!this.sessionUser?.isSupabaseUser){this.toast('اختبار الربط متاح لمدير النظام المسجل فقط.');return;}
    if(!this.aiSettings.base_url||!this.aiSettings.model){this.toast('اختر المزود والنموذج أولًا.');return;}
    if(!this.aiSettings.enabled){this.toast('احفظ الإعدادات وفعّل المساعد أولًا، ثم اختبر الاتصال.');return;}
    if(!supabaseClient){this.toast('اتصال قاعدة سمسار غير جاهز.');return;}
    this.aiTestBusy=true;
    try{
      const {data,error}=await supabaseClient.functions.invoke('samsar-ai-chat',{body:{message:'اختبار اتصال فقط. أجب بجملة قصيرة تؤكد أنك مساعد سمسار، ولا تنفذ أي إجراء.',propertyId:null,conversationId:null,channel:'staff'}});
      if(error)throw error;
      if(data?.reply){this.toast('نجح الاتصال بالمساعد الذكي الرسمي.');this.staffAssistantReply=data.reply;this.staffAssistantConversationId=data.conversationId||this.staffAssistantConversationId;}
      else throw new Error(data?.error||'no_reply');
    }catch(error){
      console.error('Samsar AI connection test failed:',error);
      this.toast('فشل الاختبار. تأكد من المفتاح السري SAMSAR_AI_API_KEY، ثم راجع إعدادات المزود.');
    }finally{this.aiTestBusy=false;}
  },
  async loadPublicSettings(){
    if(!supabaseClient)return;
    try{
      const keys=['site_brand_settings','whatsapp_public_number','site_contact_settings','ai_connection_settings','owner_listing_fee_egp','customer_service_fee_egp','refund_customer_percent','refund_support_percent'];
      const {data,error}=await supabaseClient.from('platform_settings').select('setting_key,setting_value').in('setting_key',keys);
      if(error)throw error;
      const rows=Array.isArray(data)?data:[];
      const read=key=>rows.find(row=>row.setting_key===key)?.setting_value;
      const brand=read('site_brand_settings');
      const phone=read('whatsapp_public_number');
      const contacts=read('site_contact_settings');
      const ai=read('ai_connection_settings');
      if(brand&&typeof brand==='object'&&!Array.isArray(brand))this.settings={...this.settings,...brand};
      this.settings.whatsappPhone=typeof phone==='string'?phone:'';
      if(contacts&&typeof contacts==='object'&&!Array.isArray(contacts))this.siteContactSettings={...this.siteContactSettings,...contacts};
      if(ai&&typeof ai==='object'&&!Array.isArray(ai))this.aiSettings={...this.aiSettings,...ai};
      if(!this.aiSettings.base_url)this.aiSettings.base_url=this.aiSettings.provider==='openai'?'https://api.openai.com/v1':'';
      if(!this.aiSettings.model)this.aiSettings.model='gpt-5-mini';
      this.paymentPolicy={
        owner_listing_fee_egp:Number(read('owner_listing_fee_egp')??this.paymentPolicy.owner_listing_fee_egp),
        customer_service_fee_egp:Number(read('customer_service_fee_egp')??this.paymentPolicy.customer_service_fee_egp),
        refund_customer_percent:Number(read('refund_customer_percent')??this.paymentPolicy.refund_customer_percent),
        refund_support_percent:Number(read('refund_support_percent')??this.paymentPolicy.refund_support_percent)
      };
    }catch(error){console.warn('تعذر تحميل إعدادات المنصة العامة:',error);}
  },
  async saveSettings(){
    if(this.sessionUser?.role!=='admin'||!this.sessionUser?.isSupabaseUser){this.toast('إعدادات المنصة متاحة لمدير النظام فقط.');return;}
    this.settings.name=this.settings.name.trim()||'سمسار';
    const phone=this.normalizeWhatsAppNumber(this.settings.whatsappPhone);
    if(phone&&!/^[0-9]{8,15}$/.test(phone)){this.toast('رقم واتساب غير صحيح. اكتب الرقم الدولي من 8 إلى 15 رقمًا.');return;}
    if(this.aiSettings.enabled&&(!this.aiSettings.base_url||!this.aiSettings.model)){this.toast('أدخل عنوان API واسم النموذج قبل تفعيل المساعد الخارجي.');return;}
    if(this.aiSettings.base_url&&!/^https:\/\//i.test(this.aiSettings.base_url)){this.toast('عنوان API يجب أن يبدأ بـ https://');return;}
    const feeValues=[this.paymentPolicy.owner_listing_fee_egp,this.paymentPolicy.customer_service_fee_egp,this.paymentPolicy.refund_customer_percent,this.paymentPolicy.refund_support_percent].map(Number);
    if(feeValues.some(v=>!Number.isFinite(v)||v<0)||Number(this.paymentPolicy.owner_listing_fee_egp)<=0||Number(this.paymentPolicy.refund_customer_percent)+Number(this.paymentPolicy.refund_support_percent)!==100){this.toast('راجع الرسوم ونسب الاسترداد؛ مجموع نسب الاسترداد والخدمة يجب أن يساوي 100%.');return;}
    this.settings.whatsappPhone=phone;
    this.persistDemo();
    try{
      const updates=[
        {setting_key:'site_brand_settings',setting_value:{name:this.settings.name,tagline:this.settings.tagline,primaryColor:this.settings.primaryColor,accentColor:this.settings.accentColor,backgroundColor:this.settings.backgroundColor},description:'إعدادات الهوية العامة لواجهة سمسار'},
        {setting_key:'whatsapp_public_number',setting_value:phone,description:'رقم واتساب الرسمي لاستقبال استفسارات العملاء بصيغة دولية دون علامة + أو مسافات'},
        {setting_key:'site_contact_settings',setting_value:{facebook_url:(this.siteContactSettings.facebook_url||'').trim(),official_website_url:(this.siteContactSettings.official_website_url||'').trim(),qr_target_url:(this.siteContactSettings.qr_target_url||'').trim()},description:'روابط التواصل الرسمية ورابط QR لموقع سمسار'},
        {setting_key:'ai_connection_settings',setting_value:{enabled:!!this.aiSettings.enabled,provider:this.aiSettings.provider||'openai-compatible',base_url:(this.aiSettings.base_url||'').trim().replace(/\/+$/,''),model:(this.aiSettings.model||'').trim()},description:'إعدادات عنوان ونموذج مزود الذكاء الاصطناعي؛ المفتاح السري يحفظ كـ Edge Function Secret'},
        {setting_key:'owner_listing_fee_egp',setting_value:Number(this.paymentPolicy.owner_listing_fee_egp),description:'رسوم نشر إعلان المالك بالجنيه المصري'},
        {setting_key:'customer_service_fee_egp',setting_value:Number(this.paymentPolicy.customer_service_fee_egp),description:'رسوم خدمة العميل بالجنيه المصري'},
        {setting_key:'refund_customer_percent',setting_value:Number(this.paymentPolicy.refund_customer_percent),description:'نسبة الاسترداد للعميل في الحالات المؤهلة'},
        {setting_key:'refund_support_percent',setting_value:Number(this.paymentPolicy.refund_support_percent),description:'النسبة المحتفظ بها كرسوم دعم في الحالات المؤهلة'}
      ];
      const {error}=await supabaseClient.from('platform_settings').upsert(updates,{onConflict:'setting_key'});
      if(error)throw error;
      await this.loadPublicSettings();
      this.toast('تم حفظ إعدادات الهوية والتواصل والذكاء الاصطناعي والسياسات مركزيًا.');
    }catch(error){console.error('تعذر حفظ إعدادات المنصة:',error);this.toast('تعذر حفظ بعض الإعدادات في قاعدة البيانات. راجع اتصال Supabase.');}
  },
  statusClass(status){if(['تمت الموافقة من المالك','تم قبول الموعد البديل','اكتملت المعاينة'].includes(status))return 'good';if(['مرفوضة من المالك','ملغاة من العميل','موقوف'].includes(status))return 'bad';if(['بانتظار موافقة المالك','موعد بديل مقترح','قيد المراجعة التجريبية'].includes(status))return 'pending';return '';},
  goToNotification(item){this.notificationsOpen=false;if(this.sessionUser?.role==='owner')this.scrollTo('owner-workspace');else if(['admin','staff'].includes(this.sessionUser?.role))this.openAdmin();else this.scrollTo('my-viewings');},
  askAIForProperty(property){
    this.assistantPropertyId=property?.id||'';
    this.assistantConversationId='';this.assistantMessages=[];
    this.assistantOpen=true;
    this.selectedProperty=null;
    if(property?.isDemo)this.assistantMessages.push({from:'bot',text:'تنبيه: الإعلان الحالي توضيحي للتجربة وليس عقارًا متاحًا فعليًا.'});
    this.assistantMessages.push({from:'bot',text:property?'اسألني عن تفاصيل الإعلان: '+property.title+' — '+property.area+'.':'اسألني عن العقارات المنشورة في سمسار.'});
  },
  getGuestSessionId(){
    const key='samsar_ai_guest_session_v1';
    try{
      const saved=localStorage.getItem(key);
      if(saved&&/^[A-Za-z0-9-]{32,100}$/.test(saved))return saved;
      const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
      const token=Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(key,token);
      return token;
    }catch(error){
      const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
      return Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('');
    }
  },
  quickAsk(text){this.assistantInput=text;this.askAssistant();},
  async askAssistant(){
    const question=this.assistantInput.trim();if(!question||this.assistantBusy)return;
    this.assistantMessages.push({from:'user',text:question});this.assistantInput='';this.assistantBusy=true;
    try{
      const canUseCustomerAI=!this.sessionUser?.isSupabaseUser||['customer','admin'].includes(this.sessionUser?.role);
      if(canUseCustomerAI&&supabaseClient&&this.aiSettings?.enabled){
        const conversationId=this.sessionUser?.isSupabaseUser&&!this.assistantConversationGuest?this.assistantConversationId||null:null;
        const {data,error}=await supabaseClient.functions.invoke('samsar-ai-chat',{body:{message:question,propertyId:this.assistantPropertyId||null,conversationId,channel:'customer',guestSessionId:this.sessionUser?.isSupabaseUser?null:this.getGuestSessionId()}});
        if(error)throw error;
        if(data?.reply){this.assistantConversationId=data.conversationId||this.assistantConversationId;this.assistantConversationGuest=!this.sessionUser?.isSupabaseUser;this.assistantMessages.push({from:'bot',text:data.reply});if(this.sessionUser?.isSupabaseUser)await this.loadAIHistory();return;}
      }
      const q=question.toLocaleLowerCase('ar');let reply='استخدم البحث وحدد المنطقة والميزانية ونوع العقار. المعروض حاليًا يتضمن بيانات توضيحية معلّمة كتجريبية.';
      if(q.includes('إيجار')||q.includes('للايجار')||q.includes('للإيجار')){this.filters.transaction='إيجار';reply='عرضت لك العقارات المصنفة للإيجار. راجع شارة «عرض تجريبي» قبل اعتبار أي إعلان متاحًا.';}
      else if(q.includes('بيع')||q.includes('للبيع')){this.filters.transaction='بيع';reply='عرضت لك العقارات المصنفة للبيع. راجع شارة «عرض تجريبي» قبل اعتبار أي إعلان متاحًا.';}
      else if(q.includes('معاينة'))reply='لطلب معاينة حقيقية، اختر إعلانًا منشورًا غير تجريبي وسجّل الدخول بحساب العميل.';
      else if(q.includes('تقييم'))reply='التقييمات المعروضة حاليًا توضيحية، وليست مراجعات عملاء حقيقية.';
      else if(this.assistantPropertyId){const property=this.getProperty(this.assistantPropertyId);reply=property?'بيانات الإعلان: '+property.title+'، '+property.area+' — '+property.neighborhood+'، '+property.size+' م²، '+this.money(property.price)+'. '+(property.isDemo?'هذا إعلان تجريبي غير متاح للحجز.':'لأي استفسار، استخدم «استفسار عبر سمسار» ليُراجعه الموظفون دون كشف رقم المالك.'):'لم أجد الإعلان المحدد؛ اختر عقارًا من القائمة.';}
      this.assistantMessages.push({from:'bot',text:reply});
      if(this.aiSettings?.enabled&&this.sessionUser?.isSupabaseUser)this.assistantMessages.push({from:'bot',text:'لم يكتمل الاتصال الخارجي؛ راجع إعداد مفتاح API في Supabase. الرد الحالي محلي ومؤقت.'});
      if(q.includes('إيجار')||q.includes('بيع'))this.scrollTo('properties');
    }catch(error){
      console.error('Samsar AI call failed:',error);
      this.assistantMessages.push({from:'bot',text:'خدمة الذكاء الاصطناعي الخارجية غير جاهزة أو لم يتم ضبط مفتاحها بعد. يمكنك متابعة البحث، ولن نعرض اتصالًا خارجيًا على أنه تم بنجاح.'});
    }finally{this.assistantBusy=false;}
  },
  async askStaffAssistant(){
    const raw=this.staffAssistantInput.trim();if(!raw)return;
    this.staffAssistantInput='';
    if(this.sessionUser?.isSupabaseUser&&supabaseClient&&this.aiSettings?.enabled){
      try{
        const {data,error}=await supabaseClient.functions.invoke('samsar-ai-chat',{body:{message:raw,propertyId:null,conversationId:this.staffAssistantConversationId||null,channel:'staff'}});
        if(error)throw error;
        if(data?.reply){this.staffAssistantReply=data.reply;this.staffAssistantConversationId=data.conversationId||this.staffAssistantConversationId;return;}
      }catch(error){console.error('Samsar staff AI failed:',error);}
    }
    const q=raw.toLocaleLowerCase('ar');
    this.staffAssistantReply=q.includes('معاينة')||q.includes('طلب')?'افتح تبويب «طلبات المعاينة» و«استفسارات العملاء» لمراجعة الحالات والردود.':q.includes('عقار')||q.includes('إعلان')?'افتح تبويب «العقارات» ثم راجع حالة الإعلان قبل أي إجراء.':'راجع الاستفسارات والطلبات من لوحاتها المخصصة. الذكاء الاصطناعي الخارجي لا يعمل حتى يضيف المدير مفتاح الخدمة في Supabase ويضبط إعدادات المزود.';
  },
  exportBackup(){
    const payload={exportedAt:new Date().toISOString(),note:'بيانات تجريبية محلية وليست معاملات حقيقية.',properties:this.properties,viewings:this.viewings,favorites:this.favorites,userRatings:this.userRatings,settings:this.settings};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download='samsar-demo-backup.json';link.click();URL.revokeObjectURL(url);
    this.toast('تم تجهيز نسخة البيانات التجريبية.');
  }
}
};

var samsarVueApp = Vue.createApp(SamsarApp);
samsarVueApp.config.errorHandler = function (error, instance, info) {
  showSamsarRuntimeError('Vue ' + info + ': ' + (error && (error.stack || error.message) ? (error.stack || error.message) : String(error)));
};
samsarVueApp.mount('#app');

</script>
