<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>سمسار | مساحة الموظفين</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f7f7f2;color:#174b45}.bar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid #dce8df}.brand{font-weight:900;font-size:17px}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 12px;border:1px solid #d6e5db;border-radius:8px;color:#245c50;text-decoration:none;font-size:12px;font-weight:700}.links a.active{background:#075c59;color:#fff;border-color:#075c59}iframe{display:block;width:100%;height:calc(100% - 54px);border:0;background:#faf7ef}.staff-ai-shortcut{position:fixed;z-index:9999;bottom:18px;right:50%;transform:translateX(50%);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:13px 22px;border:1px solid #e6cf91;border-radius:999px;background:linear-gradient(135deg,#fffdf6,#f4e6bd);color:#174b45;box-shadow:0 10px 30px #153e2a30;font:700 14px Tahoma,Arial,sans-serif;cursor:pointer;white-space:nowrap}.staff-ai-shortcut .bot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#0b756b;color:white;font-size:18px}.staff-ai-shortcut:hover{box-shadow:0 14px 34px #153e2a40;transform:translateX(50%) translateY(-2px)}
@media(max-width:540px){.bar{height:auto;min-height:54px;align-items:flex-start;flex-direction:column;padding:10px}.links a{padding:7px 9px}iframe{height:calc(100% - 84px)}.staff-ai-shortcut{bottom:12px;padding:10px 16px;font-size:12px}}
</style>
</head>
<body>
<header class="bar"><div class="brand">سمسار · مساحة الموظفين</div><nav class="links"><a class="active" href="./staff.html">مساحة الموظفين</a></nav></header>
<iframe id="staffWorkspaceFrame" title="لوحة تشغيل الموظفين" src="./index.html?staff=1" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<button class="staff-ai-shortcut" type="button" onclick="openStaffAssistant()" aria-label="افتح مساعد الموظفين الذكي"><span class="bot">🤖</span><span>مساعد الموظفين الذكي</span></button>
<script>
function openStaffAssistant(){
  const frame=document.getElementById("staffWorkspaceFrame");
  try{
    const doc=frame.contentDocument;
    const panel=doc&&doc.querySelector(".staff-ai-panel");
    if(panel){panel.scrollIntoView({behavior:"smooth",block:"center"});const input=panel.querySelector("input");if(input)setTimeout(()=>input.focus(),450);return;}
  }catch(e){}
  alert("سجّل الدخول إلى مساحة الموظفين أولًا، وبعدها اضغط على مساعد الموظفين الذكي.");
}
</script>
</body></html>
